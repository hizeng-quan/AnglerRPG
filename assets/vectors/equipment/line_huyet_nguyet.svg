  <polygon points="14,14 26,38 36,44" fill="#991b1b" />
  <polygon points="14,14 38,26 44,36" fill="#450a0a" />
  <polygon points="8,26 18,24 24,32" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <!-- NE Wing -->
  <polygon points="114,14 92,36 100,44" fill="#180306" stroke="#7f1d1d" stroke-width="1.2" stroke-linejoin="round" />
  <polygon points="114,14 92,36 102,26" fill="#991b1b" />
  <polygon points="114,14 102,38 100,44" fill="#450a0a" />
  <polygon points="120,26 104,32 110,24" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <!-- SE Wing -->
  <polygon points="114,114 100,84 92,92" fill="#180306" stroke="#7f1d1d" stroke-width="1.2" stroke-linejoin="round" />
  <polygon points="114,114 102,90 100,84" fill="#991b1b" />
  <polygon points="114,114 90,102 92,92" fill="#450a0a" />
  <polygon points="120,102 110,104 104,96" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <!-- SW Wing -->
  <polygon points="14,114 44,92 36,84" fill="#180306" stroke="#7f1d1d" stroke-width="1.2" stroke-linejoin="round" />
  <polygon points="14,114 38,102 44,92" fill="#991b1b" />
  <polygon points="14,114 26,90 36,84" fill="#450a0a" />
  <polygon points="8,102 24,96 18,104" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />

