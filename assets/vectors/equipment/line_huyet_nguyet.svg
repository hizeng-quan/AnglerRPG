  <polygon points="64,8 58,20 70,20" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="106,22 96,28 102,36" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="120,64 108,58 108,70" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="106,106 102,92 96,100" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="64,120 70,108 58,108" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="22,106 26,92 32,100" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="8,64 20,70 20,58" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="22,22 32,28 26,36" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />

