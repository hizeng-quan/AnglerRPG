  <polygon points="64,16 98,30 112,64 98,98 64,112 30,98 16,64 30,30" fill="#0d0204" stroke="#7f1d1d" stroke-width="2.8" stroke-linejoin="round" />
  <polygon points="64,20 95,33 108,64 95,95 64,108 33,95 20,64 33,33" fill="#240408" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="64,24 92,36 104,64 92,92 64,104 36,92 24,64 36,36" fill="#0b0103" stroke="#f59e0b" stroke-width="0.9" stroke-linejoin="round" />

