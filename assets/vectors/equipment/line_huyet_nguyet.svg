<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="bloodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Atmospheric Blood Moon Void & Miasma Aureole -->
  <circle cx="64" cy="64" r="58" fill="rgba(185, 28, 28, 0.20)" />
  <circle cx="64" cy="64" r="46" fill="rgba(88, 28, 135, 0.22)" />
  <circle cx="64" cy="64" r="34" fill="rgba(220, 38, 38, 0.24)" />

