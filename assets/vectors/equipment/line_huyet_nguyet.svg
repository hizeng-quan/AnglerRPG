  <!-- Layer 1: Blood Weave Star Lines -->
  <polygon points="64,26 102,64 64,102 26,64" fill="none" stroke="#991b1b" stroke-width="2.6" stroke-linejoin="round" />
  <polygon points="91,37 91,91 37,91 37,37" fill="none" stroke="#991b1b" stroke-width="2.6" stroke-linejoin="round" />
  <polygon points="64,28 100,64 64,100 28,64" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linejoin="round" />
  <polygon points="89,39 89,89 39,89 39,39" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linejoin="round" />
  <polygon points="64,30 98,64 64,98 30,64" fill="none" stroke="#fca5a5" stroke-width="0.8" stroke-linejoin="round" />

  <!-- Circular Arterial Coils Underlay -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#450a0a" stroke-width="3.0" />
  <circle cx="64" cy="64" r="26" fill="none" stroke="#dc2626" stroke-width="1.8" />
  <circle cx="64" cy="64" r="23" fill="none" stroke="#f87171" stroke-width="1.0" />

