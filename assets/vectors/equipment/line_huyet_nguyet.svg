  <polygon points="64,44 84,64 64,84 44,64" fill="#180406" stroke="#f59e0b" stroke-width="1.4" stroke-linejoin="round" />
  <!-- Top-Left Facet (Brightest Blood Crimson) -->
  <polygon points="64,46 46,64 64,64" fill="#ef4444" />
  <!-- Top-Right Facet (Deep Ruby Radiant) -->
  <polygon points="64,46 82,64 64,64" fill="#dc2626" />
  <!-- Bottom-Left Facet (Dark Crimson Shade) -->
  <polygon points="46,64 64,82 64,64" fill="#991b1b" />
  <!-- Bottom-Right Facet (Abyssal Blood Shadow) -->
  <polygon points="82,64 64,82 64,64" fill="#580812" />

  <!-- 4 Crimson Tendrils / Tendon Claws Grasping Heart -->
  <path d="M 64,34 Q 68,42 64,46" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 94,64 Q 86,68 82,64" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 64,94 Q 60,86 64,82" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 34,64 Q 42,60 46,64" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" />

  <!-- All-Seeing Demon Eye in Core -->
  <circle cx="64" cy="64" r="9.5" fill="#0d0102" stroke="#ef4444" stroke-width="1.2" />
  <circle cx="64" cy="64" r="7.0" fill="#7f1d1d" />
  <ellipse cx="64" cy="64" rx="2.0" ry="6.0" fill="#080001" />
  <!-- Burning Ember Slit Pupil Core -->
  <ellipse cx="64" cy="64" rx="0.9" ry="3.8" fill="#facc15" />

  <!-- 6. Floating Blood Crystal Shards -->
  <polygon points="64,3 67,8 64,13 61,8" fill="#ef4444" stroke="#fca5a5" stroke-width="0.6" />
  <polygon points="125,64 120,67 115,64 120,61" fill="#ef4444" stroke="#fca5a5" stroke-width="0.6" />
  <polygon points="64,125 61,120 64,115 67,120" fill="#ef4444" stroke="#fca5a5" stroke-width="0.6" />
  <polygon points="3,64 8,61 13,64 8,67" fill="#ef4444" stroke="#fca5a5" stroke-width="0.6" />

  <!-- 7. Diamond Specular Glints & Brilliant Razor Sparkles -->
  <circle cx="14" cy="14" r="2.0" fill="#ffffff" />
  <circle cx="114" cy="14" r="2.0" fill="#ffffff" />
  <circle cx="114" cy="114" r="2.0" fill="#ffffff" />
  <circle cx="14" cy="114" r="2.0" fill="#ffffff" />
  <circle cx="64" cy="46" r="1.6" fill="#ffffff" />
  <circle cx="64" cy="64" r="1.2" fill="#ffffff" />
  <circle cx="46" cy="64" r="1.2" fill="#ffffff" />
</svg>
