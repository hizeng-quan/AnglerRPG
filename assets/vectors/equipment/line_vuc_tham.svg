  <polygon points="98,30 106,24 102,34" fill="#e879f9" />
  <polygon points="98,98 106,104 102,94" fill="#e879f9" />
  <polygon points="30,30 22,24 26,34" fill="#e879f9" />
  <polygon points="30,98 22,104 26,94" fill="#e879f9" />

