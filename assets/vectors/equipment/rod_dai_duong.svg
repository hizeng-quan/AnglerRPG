<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Abyssal Bioluminescent Vortex Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(6, 182, 212, 0.20)" />
  <circle cx="84" cy="44" r="38" fill="rgba(2, 132, 199, 0.18)" />

  <!-- 2. Abyssal Cobalt-Steel & Coral-Gold Scepter Shaft (Diagonal) -->
  <line x1="24" y1="104" x2="80" y2="48" stroke="#082f49" stroke-width="6.5" stroke-linecap="round" />
  <line x1="24" y1="104" x2="80" y2="48" stroke="#0284c7" stroke-width="4.2" stroke-linecap="round" />
  <line x1="24" y1="104" x2="80" y2="48" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round" />
  <line x1="25" y1="103" x2="79" y2="49" stroke="#e0f2fe" stroke-width="1.0" stroke-linecap="round" />

  <!-- 3. Golden Sea-Coral Spiral Wraps and Node Rings -->
  <!-- Ring 1 -->
  <circle cx="38" cy="90" r="3.4" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
  <circle cx="38" cy="90" r="1.5" fill="#06b6d4" />
  <!-- Ring 2 -->
  <circle cx="52" cy="76" r="3.4" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
  <circle cx="52" cy="76" r="1.5" fill="#06b6d4" />
  <!-- Ring 3 -->
  <circle cx="66" cy="62" r="3.4" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
  <circle cx="66" cy="62" r="1.5" fill="#06b6d4" />

  <!-- 4. Neptune Wave Trident Crown Headpiece (Top-Right) -->
  <circle cx="82" cy="46" r="14" fill="rgba(6, 182, 212, 0.22)" />
  <!-- Central Spear Trident Blade -->
  <polygon points="82,46 108,20 90,44" fill="#0284c7" />
  <polygon points="82,46 108,20 84,38" fill="#0ea5e9" />
  <line x1="82" y1="46" x2="108" y2="20" stroke="#ffffff" stroke-width="1.6" />

  <!-- Left Curved Tidal Wave Prong -->
  <path d="M 82,46 Q 74,32 78,24 Q 84,28 88,38" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  <polygon points="78,24 72,26 78,32" fill="#67e8f9" />

  <!-- Right Curved Tidal Wave Prong -->
  <path d="M 82,46 Q 96,54 104,50 Q 100,44 90,40" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  <polygon points="104,50 102,56 96,50" fill="#67e8f9" />

  <!-- 5. Central Royal Aquamarine Diamond Gem & Ocean Pearl -->
  <polygon points="82,38 90,46 82,54 74,46" fill="#0c4a6e" stroke="#fbbf24" stroke-width="1.4" />
  <polygon points="82,40 88,46 82,52 76,46" fill="#06b6d4" />
  <!-- Iridescent Giant Ocean Pearl Finial -->
  <circle cx="82" cy="46" r="3.2" fill="#f8fafc" stroke="#d97706" stroke-width="0.8" />
  <circle cx="81" cy="45" r="1.4" fill="#ffffff" />

  <!-- 6. Bottom Pommel Ocean Sapphire -->
  <circle cx="23" cy="105" r="5" fill="#082f49" stroke="#d97706" stroke-width="1.4" />
  <circle cx="23" cy="105" r="2.8" fill="#06b6d4" />
  <circle cx="22" cy="104" r="1" fill="#ffffff" />

  <!-- 7. Specular Glints -->
  <circle cx="108" cy="20" r="2.0" fill="#ffffff" />
  <circle cx="78" cy="24" r="1.2" fill="#ffffff" />
  <circle cx="104" cy="50" r="1.2" fill="#ffffff" />
</svg>
