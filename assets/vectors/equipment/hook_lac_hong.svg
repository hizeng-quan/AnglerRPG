<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Explosive Ancestral Mythic Aura -->
    <radialGradient id="lhHookAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lhJadeShankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="lhGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lotusPetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <radialGradient id="tienChauPearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="44" fill="#fde047" opacity="0.16"/>
    <circle cx="76" cy="24" r="16" fill="#f472b6" opacity="0.18"/>
  </g>

  <!-- LAYER 2: Base Form (Jade Hook Shank, Sacred Lotus Base, Chim Lạc Beak Barb) -->
  <g id="base_form">
    <!-- Flowing Red & Gold Silk Streamers from Eyelet -->
    <path d="M 82 28 Q 98 42 104 68 Q 96 62 90 48 Z" fill="#dc2626"/>
    <path d="M 84 32 Q 106 52 112 80 Q 104 70 94 56 Z" fill="#f59e0b"/>
    <polygon points="112,80 116,88 108,84" fill="#991b1b"/>

    <!-- Main Imperial Jade Hook Shank & Curve -->
    <path d="M 72 32 L 80 32 L 80 74 Q 80 106 52 106 Q 24 106 24 82 Q 24 64 38 52 L 42 60 Q 32 68 32 82 Q 32 98 52 98 Q 72 98 72 74 L 72 32 Z" fill="url(#lhJadeShankGrad)"/>

    <!-- Sacred Lotus Flower Petals at the Bottom Bend (Đài Sen Mẫu Âu Cơ) -->
    <!-- Center lotus petal cradling the bend -->
    <path d="M 40 102 C 46 116 58 116 64 102 C 58 98 46 98 40 102 Z" fill="url(#lotusPetalGrad)"/>
    <!-- Left outer lotus petal -->
    <path d="M 28 92 C 22 104 36 114 44 104 C 38 98 32 94 28 92 Z" fill="url(#lotusPetalGrad)"/>
    <!-- Right outer lotus petal -->
    <path d="M 60 104 C 68 114 82 104 76 92 C 72 94 66 98 60 104 Z" fill="url(#lotusPetalGrad)"/>
    <!-- Gold Lotus Calyx / Stamens -->
    <polygon points="46,100 52,94 58,100" fill="url(#lhGoldGrad)"/>
    <polygon points="36,94 40,88 44,95" fill="url(#lhGoldGrad)"/>
    <polygon points="60,95 64,88 68,94" fill="url(#lhGoldGrad)"/>

    <!-- Chim Lạc Head & Curved Sacred Beak forming the Barb -->
    <!-- Chim Lạc head and crown crest -->
    <polygon points="38,52 46,38 42,60" fill="url(#lhGoldGrad)"/>
    <!-- Vicious razor curved golden beak barb pointing downward/inward -->
    <path d="M 46 38 Q 42 42 48 50 Q 42 46 38 52 Z" fill="#fde047"/>
    <!-- Chim Lạc sweeping wing plume along the hook bend -->
    <path d="M 38 60 Q 28 72 30 84 Q 34 76 42 68 Z" fill="url(#lhGoldGrad)"/>
  </g>

  <!-- LAYER 3: Details & Relief (Dong Son Waves, Chim Lạc Eye, Tiên Châu Pearl Eyelet) -->
  <g id="details_and_relief">
    <!-- Tiên Châu Radiant Pearl & Crown Eyelet -->
    <circle cx="76" cy="24" r="12" fill="url(#lhGoldGrad)"/>
    <circle cx="76" cy="24" r="8" fill="url(#tienChauPearl)"/>

    <!-- Ancestral Wave Relief on Jade Shank -->
    <path d="M 73 42 Q 78 40 78 46 Q 73 48 78 52 Q 73 54 78 58 Q 73 60 78 64" fill="none" stroke="#fde047" stroke-width="1.5"/>
    <line x1="72" y1="36" x2="80" y2="36" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="72" y1="70" x2="80" y2="70" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Chim Lạc Ruby Eye -->
    <circle cx="43" cy="48" r="2" fill="#ef4444"/>
    <circle cx="42.5" cy="47.5" r="0.6" fill="#ffffff"/>

    <!-- Lotus Petal Central Ridge Lines -->
    <line x1="52" y1="96" x2="52" y2="114" stroke="#fef08a" stroke-width="1"/>
    <line x1="36" y1="94" x2="32" y2="108" stroke="#fef08a" stroke-width="1"/>
    <line x1="68" y1="94" x2="72" y2="108" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Mythic Radiance, Diamond Sharp Beak, Pearl Sheen) -->
  <g id="specular_highlights">
    <!-- Tiên Châu Pearl Gloss Highlight -->
    <ellipse cx="74" cy="21" rx="2.5" ry="1.5" fill="#ffffff" transform="rotate(-30 74 21)"/>
    <!-- Chim Lạc Razor Beak Tip Sparkle -->
    <polygon points="46,38 48,42 44,40" fill="#ffffff"/>
    <line x1="46" y1="38" x2="48" y2="50" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Outer Lotus Petal Rim Glow -->
    <path d="M 42 104 Q 52 118 62 104" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <!-- Jade Shank Polished Gloss Line -->
    <line x1="74" y1="34" x2="74" y2="68" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
    <!-- Crown Eyelet Top Glint -->
    <circle cx="76" cy="12" r="1.5" fill="#ffffff"/>
  </g>
</svg>
