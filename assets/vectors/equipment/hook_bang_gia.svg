<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Glacial Mist & Arctic Blizzard Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(56, 189, 248, 0.20)" />
  <circle cx="64" cy="64" r="42" fill="rgba(191, 219, 254, 0.18)" />

  <!-- 2. Hexagonal Cryo Crystal Eyelet (Top-Center) -->
  <polygon points="64,18 74,24 74,36 64,42 54,36 54,24" fill="#0c2d5e" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="64" cy="30" r="5" fill="#0284c7" stroke="#bae6fd" stroke-width="1.2" />
  <circle cx="64" cy="30" r="2.5" fill="#0f172a" />
  <circle cx="62.5" cy="28.5" r="1.4" fill="#ffffff" />

  <!-- 3. Faceted Crystalline Ice Anchor Pillar Shank (Centered Vertical) -->
  <!-- Deep sapphire inner structure -->
  <polygon points="61,42 67,42 69,76 59,76" fill="#0c2d5e" />
  <!-- Radiant turquoise crystal column -->
  <polygon points="62,42 66,42 68,76 60,76" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  <!-- Central Ice Prism Highlight -->
  <line x1="64" y1="42" x2="64" y2="76" stroke="#ffffff" stroke-width="1.6" />

  <!-- 4. Dual Crystalline Frost Anchor Wings & Symmetrical Barbs (Cánh mỏ neo băng giá) -->
  <!-- Left Frost Wing & Razor Barb -->
  <path d="M 60,74 Q 38,76 30,94 Q 28,102 38,100 Q 52,94 62,82 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="30,94 22,86 34,88" fill="#bae6fd" stroke="#ffffff" stroke-width="0.8" />
  <!-- Left Ice Facet -->
  <path d="M 58,76 Q 42,78 34,92 Q 44,90 58,82 Z" fill="#7dd3fc" />

  <!-- Right Frost Wing & Razor Barb (Symmetric) -->
  <path d="M 68,74 Q 90,76 98,94 Q 100,102 90,100 Q 76,94 66,82 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="98,94 106,86 94,88" fill="#bae6fd" stroke="#ffffff" stroke-width="0.8" />
  <!-- Right Ice Facet -->
  <path d="M 70,76 Q 86,78 94,92 Q 84,90 70,82 Z" fill="#7dd3fc" />

  <!-- 5. Central 6-Pointed Snowflake Core Medallion on Shank -->
  <circle cx="64" cy="62" r="10" fill="rgba(56, 189, 248, 0.35)" />
  <polygon points="64,54 68,60 74,60 70,64 72,70 64,66 56,70 58,64 54,60 60,60" fill="#e0f2fe" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="64" cy="62" r="2.5" fill="#ffffff" />

  <!-- 6. Bottom Glacier Point (Chóp nhọn mỏ neo băng đáy) -->
  <polygon points="60,80 68,80 64,96" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  <polygon points="62,80 66,80 64,94" fill="#ffffff" />

  <!-- 7. Specular Glints -->
  <circle cx="22" cy="86" r="2.0" fill="#ffffff" />
  <circle cx="106" cy="86" r="2.0" fill="#ffffff" />
  <circle cx="64" cy="95" r="1.6" fill="#ffffff" />
  <circle cx="64" cy="62" r="1.5" fill="#ffffff" />
</svg>
