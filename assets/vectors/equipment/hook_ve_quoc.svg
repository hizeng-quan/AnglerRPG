<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="vqHookAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bronzeClawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="ironSpineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="42" fill="#ef4444" opacity="0.16"/>
    <circle cx="80" cy="26" r="16" fill="#f59e0b" opacity="0.18"/>
  </g>

  <!-- LAYER 2: Base Form (Faceted Dragon Claw Sickle Hook & Crimson War Ribbon) -->
  <g id="base_form">
    <!-- Fluttering Crimson War Ribbon flowing from eyelet -->
    <path d="M 86 36 Q 96 48 102 68 Q 98 62 92 52 Z" fill="url(#ribbonGrad)"/>
    <path d="M 88 40 Q 106 58 114 84 Q 106 74 96 60 Z" fill="#b91c1c"/>
    <polygon points="114,84 116,92 108,88" fill="#7f1d1d"/>

    <!-- Main Claw Hook Silhouette (Thick bronze sickle shank & curve) -->
    <!-- Shank outer line down to curve and up to vicious talon barb -->
    <path d="M 76 34 L 84 34 L 84 72 Q 84 104 56 104 Q 28 104 28 80 Q 28 64 42 54 L 46 62 Q 36 70 36 80 Q 36 96 56 96 Q 74 96 74 72 L 74 34 Z" fill="url(#bronzeClawGrad)"/>
    <!-- Razor talon barb -->
    <polygon points="42,54 48,42 46,62" fill="#d97706"/>
    <!-- Inner talon hook blade bevel -->
    <path d="M 74 38 L 80 38 L 80 70 Q 80 98 56 98 Q 38 98 38 82 Q 38 72 44 64 L 42 54 Q 32 66 32 80 Q 32 102 56 102 Q 82 102 82 72 L 82 38 Z" fill="#92400e"/>

    <!-- Eyelet Heavy Bronze Ring at Top -->
    <circle cx="80" cy="26" r="14" fill="url(#bronzeClawGrad)"/>
    <circle cx="80" cy="26" r="8" fill="#0f172a"/>
  </g>

  <!-- LAYER 3: Details & Relief (Dragon Spine Plates, Rivets, Gold Star Crest) -->
  <g id="details_and_relief">
    <!-- Jagged Spine Armor Plates on the outer curve of the hook -->
    <polygon points="84,46 92,42 84,54" fill="url(#ironSpineGrad)"/>
    <polygon points="84,58 93,56 84,66" fill="url(#ironSpineGrad)"/>
    <polygon points="82,70 91,72 80,78" fill="url(#ironSpineGrad)"/>
    <polygon points="74,84 81,90 70,92" fill="url(#ironSpineGrad)"/>
    <polygon points="62,96 66,105 54,102" fill="url(#ironSpineGrad)"/>
    <polygon points="46,102 44,111 36,98" fill="url(#ironSpineGrad)"/>

    <!-- Gold Star Crest Medallion at the Eyelet -->
    <circle cx="80" cy="26" r="6" fill="#78350f"/>
    <!-- 5-Pointed Star of National Defense -->
    <polygon points="80,21 81.8,24.8 86,25.4 83,28.2 83.7,32.4 80,30.4 76.3,32.4 77,28.2 74,25.4 78.2,24.8" fill="url(#goldStarGrad)"/>

    <!-- Steel Bevel Ridge along Shank -->
    <line x1="79" y1="38" x2="79" y2="72" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 79 72 Q 79 92 56 92 Q 42 92 42 80" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Heavy Bronze Binding Rivets -->
    <circle cx="76" cy="38" r="1.5" fill="#fef08a"/>
    <circle cx="82" cy="38" r="1.5" fill="#fef08a"/>
    <circle cx="79" cy="50" r="1.5" fill="#fef08a"/>
    <circle cx="79" cy="62" r="1.5" fill="#fef08a"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Chiseled Steel Edges, Talon Glimmer, Eyelet Glint) -->
  <g id="specular_highlights">
    <!-- Eyelet High Metallic Sheen -->
    <path d="M 72 20 Q 80 14 88 20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Razor Sharp Talon Tip Glint -->
    <polygon points="48,42 46,47 44,45" fill="#ffffff"/>
    <line x1="48" y1="42" x2="42" y2="54" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <!-- Inner Hook Blade Razor Glint -->
    <path d="M 44 64 Q 38 72 38 80 Q 38 94 56 94" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
    <!-- Shank Highlight -->
    <line x1="75" y1="40" x2="75" y2="68" stroke="#ffffff" stroke-width="1" opacity="0.75"/>
    <circle cx="80" cy="26" r="1" fill="#ffffff"/>
  </g>
</svg>
