<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Cataclysmic Blood Moon Eclipse & Crimson Flame Halo -->
  <circle cx="86" cy="40" r="46" fill="rgba(153, 27, 27, 0.28)" />
  <circle cx="86" cy="40" r="34" fill="rgba(239, 68, 68, 0.25)" />
  <circle cx="50" cy="76" r="38" fill="rgba(88, 28, 135, 0.20)" />

  <!-- 2. Demonic Vertebrae War-Staff Blank (Diagonal Stance) -->
  <line x1="18" y1="110" x2="86" y2="42" stroke="#090101" stroke-width="9.0" stroke-linecap="round" />
  <line x1="18" y1="110" x2="86" y2="42" stroke="#450a0a" stroke-width="6.5" stroke-linecap="round" />
  <line x1="20" y1="108" x2="84" y2="44" stroke="#991b1b" stroke-width="4.0" stroke-linecap="round" />
  <line x1="20" y1="108" x2="84" y2="44" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" />
  <line x1="21" y1="107" x2="83" y2="45" stroke="#fecaca" stroke-width="0.8" stroke-linecap="round" />

  <!-- Dragon Vertebrae Rib Plates Along Staff -->
  <polygon points="34,94 40,88 38,96" fill="#f87171" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="46,82 52,76 50,84" fill="#f87171" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="58,70 64,64 62,72" fill="#f87171" stroke="#450a0a" stroke-width="0.8" />
  <polygon points="70,58 76,52 74,60" fill="#f87171" stroke="#450a0a" stroke-width="0.8" />

  <!-- 3. Gigantic Crescent Blood Moon Reaper Scythe Blade (Lưỡi Hái Trăng Máu) -->
  <!-- Outer Blade Silhouette (Obsidian & Ruby Edge) -->
  <path d="M 76,50 C 72,30 90,8 118,6 C 122,5 125,7 124,11 C 114,24 102,36 94,54 Z" fill="#180406" stroke="#991b1b" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Radiant Blood Crimson Mid-Blade -->
  <path d="M 78,48 C 76,32 92,12 116,9 C 113,21 103,34 94,50 Z" fill="#dc2626" />
  <!-- Blazing Razor Edge Gradient Line -->
  <path d="M 80,46 C 80,34 94,15 114,11" fill="none" stroke="#fca5a5" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 80,46 C 80,34 94,15 114,11" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" />

  <!-- Serrated Inner Blade Teeth (Răng cưa xé thịt) -->
  <polygon points="98,40 102,42 96,46" fill="#f87171" />
  <polygon points="106,28 110,31 104,34" fill="#f87171" />
  <polygon points="113,17 116,20 111,23" fill="#f87171" />

  <!-- 4. Blood Moon Eclipse Core Orb at (86, 42) -->
  <!-- Corona Flame Spikes -->
  <polygon points="86,22 83,30 89,30" fill="#ef4444" />
  <polygon points="106,42 98,39 98,45" fill="#ef4444" />
  <polygon points="86,62 89,54 83,54" fill="#ef4444" />
  <polygon points="66,42 74,45 74,39" fill="#ef4444" />
  <polygon points="100,28 92,34 96,38" fill="#f87171" />
  <polygon points="100,56 96,48 92,52" fill="#f87171" />
  <polygon points="72,56 80,52 76,48" fill="#f87171" />
  <polygon points="72,28 76,38 80,34" fill="#f87171" />

  <!-- Blood Moon Sphere -->
  <circle cx="86" cy="42" r="14" fill="#7f1d1d" stroke="#f87171" stroke-width="1.8" />
  <circle cx="86" cy="42" r="11" fill="#dc2626" />
  <!-- Dark Eclipse Shadow Occlusion -->
  <path d="M 86,31 A 11 11 0 0 1 86,53 A 8 11 0 0 0 86,31" fill="#1c0406" />

  <!-- 5. Demonic Spiked Butt Cap with Chains & Blood Drops -->
  <rect x="14" y="98" width="14" height="12" rx="2" transform="rotate(-45 21 104)" fill="#1c0406" stroke="#991b1b" stroke-width="1.2" />
  <circle cx="16" cy="112" r="5.0" fill="#991b1b" stroke="#f87171" stroke-width="1.2" />
  <polygon points="16,112 10,124 15,121 16,126 19,121 24,124" fill="#ef4444" />

  <!-- Bleeding Crimson Droplets Falling From Scythe Tip -->
  <circle cx="120" cy="16" r="2.2" fill="#ef4444" />
  <polygon points="120,13 118,17 122,17" fill="#ef4444" />
  <circle cx="112" cy="28" r="1.6" fill="#ef4444" />

  <!-- 6. Supreme Specular Highlights & Glints -->
  <circle cx="124" cy="9" r="2.0" fill="#ffffff" />
  <circle cx="86" cy="40" r="2.2" fill="#ffffff" opacity="0.9" />
  <circle cx="80" cy="46" r="1.5" fill="#ffffff" />
  <circle cx="16" cy="110" r="1.5" fill="#ffffff" />
</svg>
