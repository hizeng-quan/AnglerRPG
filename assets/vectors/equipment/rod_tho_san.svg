<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Predatory Camo Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(34, 197, 94, 0.16)" />
  <circle cx="78" cy="50" r="38" fill="rgba(245, 158, 11, 0.14)" />

  <!-- 2. Heavy Wrought-Iron Reinforced Core Shaft (Diagonal) -->
  <line x1="24" y1="104" x2="90" y2="38" stroke="#142616" stroke-width="5.5" stroke-linecap="round" />
  <line x1="24" y1="104" x2="90" y2="38" stroke="#22542a" stroke-width="3.8" stroke-linecap="round" />
  <line x1="25" y1="103" x2="89" y2="39" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round" />

  <!-- 3. Rawhide Leather Bindings & Polished Brass Rings -->
  <!-- Joint Brass Rings -->
  <circle cx="44" cy="84" r="3.2" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
  <circle cx="62" cy="66" r="3.2" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
  <circle cx="80" cy="48" r="3.0" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
  <!-- Leather Bindings -->
  <line x1="33" y1="92" x2="39" y2="98" stroke="#78350f" stroke-width="2.2" />
  <line x1="39" y1="86" x2="45" y2="92" stroke="#78350f" stroke-width="2.2" />
  <line x1="51" y1="74" x2="57" y2="80" stroke="#78350f" stroke-width="2.2" />
  <line x1="69" y1="56" x2="75" y2="62" stroke="#78350f" stroke-width="2.2" />

  <!-- 4. Hunter Ceramic Line Guides (Emerald Ring Inserts) -->
  <line x1="53" y1="75" x2="49" y2="71" stroke="#d97706" stroke-width="1.8" />
  <circle cx="48" cy="70" r="2.4" fill="#052e16" stroke="#10b981" stroke-width="1" />
  <circle cx="48" cy="70" r="1.0" fill="#34d399" />

  <line x1="71" y1="57" x2="67" y2="53" stroke="#d97706" stroke-width="1.8" />
  <circle cx="66" cy="52" r="2.2" fill="#052e16" stroke="#10b981" stroke-width="1" />
  <circle cx="66" cy="52" r="0.9" fill="#34d399" />

  <!-- 5. Beast Fang Pommel & Tiger-Eye Core (Bottom-Left) -->
  <circle cx="23" cy="105" r="5.5" fill="#142616" stroke="#d97706" stroke-width="1.5" />
  <circle cx="23" cy="105" r="3.2" fill="#f59e0b" />
  <!-- Vertical Slit Pupil -->
  <line x1="23" y1="102" x2="23" y2="108" stroke="#022c22" stroke-width="1.2" />
  <circle cx="22" cy="104" r="1" fill="#ffffff" />

  <!-- 6. Damascus Harpoon Spearhead (Top-Right) -->
  <circle cx="90" cy="38" r="3.5" fill="#142616" stroke="#64748b" stroke-width="1" />
  <!-- Twin Lateral Barbs -->
  <polygon points="90,38 98,48 88,44" fill="#475569" stroke="#94a3b8" stroke-width="0.8" />
  <polygon points="90,38 80,30 84,40" fill="#475569" stroke="#94a3b8" stroke-width="0.8" />
  <!-- Main Spearhead Body -->
  <polygon points="86,42 110,18 94,34" fill="#334155" />
  <polygon points="94,34 110,18 90,46" fill="#1e293b" />
  <!-- Blade Sharp Facet -->
  <polygon points="92,36 110,18 98,30" fill="#cbd5e1" />
  <!-- Emerald Venom Groove -->
  <line x1="90" y1="38" x2="104" y2="24" stroke="#10b981" stroke-width="1.4" />
  <line x1="90" y1="38" x2="104" y2="24" stroke="#6ee7b7" stroke-width="0.7" />

  <!-- 7. Specular Glints -->
  <circle cx="110" cy="18" r="2.0" fill="#ffffff" />
  <circle cx="90" cy="38" r="1.2" fill="#ffffff" />
  <circle cx="62" cy="66" r="1.2" fill="#ffffff" />
</svg>
