<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Steel-Amber Rustic Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(148, 163, 184, 0.18)" />
  <circle cx="64" cy="64" r="42" fill="rgba(245, 158, 11, 0.14)" />

  <!-- 2. Tempered Steel Hook Body -->
  <!-- Under-shadow spine -->
  <path d="M 44,28 L 44,82 Q 44,106 68,106 Q 92,106 92,82 L 92,62" fill="none" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round" />
  <!-- Polished High-Carbon Steel Core -->
  <path d="M 44,28 L 44,82 Q 44,106 68,106 Q 92,106 92,82 L 92,62" fill="none" stroke="#475569" stroke-width="4.2" stroke-linecap="round" />
  <!-- Light Reflective Edge -->
  <path d="M 45,28 L 45,82 Q 45,104.5 68,104.5 Q 91,104.5 91,82 L 91,64" fill="none" stroke="#cbd5e1" stroke-width="1.4" />

  <!-- 3. Eyelet Ring Loop (Top of Shank) -->
  <circle cx="44" cy="28" r="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <circle cx="44" cy="28" r="3" fill="#020617" />
  <circle cx="42.5" cy="26.5" r="1.2" fill="#ffffff" />

  <!-- 4. Razor Sharp Point & Barb Fang -->
  <polygon points="92,62 88,68 96,68" fill="#e2e8f0" />
  <!-- Barb Fang -->
  <polygon points="92,72 82,78 92,80" fill="#94a3b8" />
  <line x1="92" y1="72" x2="82" y2="78" stroke="#ffffff" stroke-width="1" />

  <!-- 5. Clamped Split-Shot Lead Sinker -->
  <circle cx="44" cy="48" r="10" fill="#1e293b" />
  <circle cx="44" cy="48" r="8.5" fill="#475569" stroke="#94a3b8" stroke-width="1" />
  <!-- Split Clamp Groove -->
  <line x1="36" y1="48" x2="52" y2="48" stroke="#0f172a" stroke-width="2" />
  <circle cx="41.5" cy="45.5" r="2.2" fill="#cbd5e1" />
  <circle cx="41" cy="45" r="1" fill="#ffffff" />

  <!-- 6. Wriggling Red Earthworm Bait -->
  <path d="M 64,106 Q 74,114 84,108 Q 94,102 96,112" fill="none" stroke="#b91c1c" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 64,106 Q 74,114 84,108 Q 94,102 96,112" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  <!-- Worm Segments & Highlights -->
  <circle cx="74" cy="111" r="1.5" fill="#fca5a5" />
  <circle cx="84" cy="107" r="1.5" fill="#fca5a5" />
  <circle cx="95" cy="111" r="1.2" fill="#ffffff" />

  <!-- 7. Specular Glint on Needle Point -->
  <circle cx="92" cy="62" r="1.6" fill="#ffffff" />
</svg>
