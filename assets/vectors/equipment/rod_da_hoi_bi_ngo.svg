<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Spooky Phantom Violet & Radiant Pumpkin Orange Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(147, 51, 234, 0.20)" />
  <circle cx="64" cy="64" r="42" fill="rgba(249, 115, 22, 0.22)" />
  <circle cx="45" cy="83" r="28" fill="rgba(234, 88, 12, 0.25)" />

  <!-- 2. Twisted Dark Obsidian Thorn Rod Blank -->
  <line x1="24" y1="104" x2="88" y2="40" stroke="#18181b" stroke-width="7.5" stroke-linecap="round" />
  <line x1="24" y1="104" x2="88" y2="40" stroke="#581c87" stroke-width="5.0" stroke-linecap="round" />
  <line x1="25" y1="103" x2="87" y2="41" stroke="#9333ea" stroke-width="2.6" stroke-linecap="round" />
  <line x1="26" y1="102" x2="86" y2="42" stroke="#fbcfe8" stroke-width="0.8" stroke-linecap="round" />

  <!-- Spiraling Pumpkin Orange Vine Wraps -->
  <line x1="34" y1="96" x2="39" y2="89" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round" />
  <line x1="50" y1="80" x2="55" y2="73" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round" />
  <line x1="66" y1="64" x2="71" y2="57" stroke="#ea580c" stroke-width="3.0" stroke-linecap="round" />
  <line x1="78" y1="52" x2="83" y2="45" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" />

  <!-- 3. Carved Jack-o'-Lantern Reel & Headpiece at (45, 83) -->
  <!-- Outer Pumpkin Lobes -->
  <circle cx="37" cy="83" r="14" fill="#c2410c" stroke="#431407" stroke-width="1.2" />
  <circle cx="53" cy="83" r="14" fill="#c2410c" stroke="#431407" stroke-width="1.2" />
  <!-- Center Main Lobe -->
  <circle cx="45" cy="83" r="16" fill="#ea580c" stroke="#431407" stroke-width="1.2" />
  <circle cx="45" cy="82" r="14" fill="#f97316" />

  <!-- Curly Green Stem -->
  <path d="M 45,67 Q 44,60 48,58 Q 52,58 50,65" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="45" cy="67" r="2.5" fill="#15803d" />

  <!-- Carved Fiery Face (Eyes, Nose, Grin) -->
  <!-- Left Eye -->
  <polygon points="38,79 43,82 39,84" fill="#fef08a" stroke="#b45309" stroke-width="0.6" />
  <!-- Right Eye -->
  <polygon points="52,79 47,82 51,84" fill="#fef08a" stroke="#b45309" stroke-width="0.6" />
  <!-- Nose -->
  <polygon points="45,82 43,85 47,85" fill="#fef08a" />
  <!-- Toothy Wicked Grin -->
  <polygon points="37,87 41,92 45,88 49,92 53,87 49,90 45,86 41,90" fill="#fef08a" stroke="#b45309" stroke-width="0.6" />

  <!-- 4. Rod Guide Rings & Amber Jewels -->
  <!-- Ring 1 -->
  <circle cx="62" cy="66" r="4.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.0" />
  <circle cx="62" cy="66" r="2.2" fill="#fef08a" />
  <!-- Ring 2 -->
  <circle cx="76" cy="52" r="4.0" fill="#f59e0b" stroke="#78350f" stroke-width="1.0" />
  <circle cx="76" cy="52" r="1.8" fill="#fef08a" />
  <!-- Tip Ring with Amber Spark -->
  <circle cx="88" cy="40" r="5.0" fill="#f59e0b" stroke="#78350f" stroke-width="1.2" />
  <circle cx="88" cy="40" r="2.6" fill="#fef08a" />
  <polygon points="88,34 89.5,38.5 94,40 89.5,41.5 88,46 86.5,41.5 82,40 86.5,38.5" fill="#ffffff" opacity="0.8" />

  <!-- Grip: Obsidian Wrap with Violet Bands -->
  <rect x="20" y="96" width="14" height="10" rx="2" transform="rotate(-45 27 101)" fill="#27272a" stroke="#a855f7" stroke-width="1.0" />
  <circle cx="18" cy="110" r="4.0" fill="#a855f7" stroke="#3b0764" stroke-width="1.2" />
  <circle cx="18" cy="110" r="2.0" fill="#fbcfe8" />

  <!-- 5. Specular Highlights -->
  <circle cx="41" cy="74" r="2.2" fill="#ffffff" opacity="0.7" />
  <circle cx="62" cy="64" r="1.2" fill="#ffffff" />
  <circle cx="88" cy="38" r="1.4" fill="#ffffff" />
</svg>
