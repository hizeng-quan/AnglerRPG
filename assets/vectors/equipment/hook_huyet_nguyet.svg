<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="bloodGlowHook" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Atmospheric Blood Moon Void & Miasma Aureole -->
  <circle cx="64" cy="64" r="58" fill="rgba(185, 28, 28, 0.20)" />
  <circle cx="48" cy="40" r="38" fill="rgba(88, 28, 135, 0.22)" />
  <circle cx="96" cy="80" r="32" fill="rgba(220, 38, 38, 0.24)" />

  <!-- 2. Demonic Horned Skull Crown Top (Khoen Vương Miện Sừng Rồng Ma Vương) -->
  <!-- Left Giant Demon Horn -->
  <path d="M 44,22 C 34,14 22,12 14,20 C 18,25 28,26 38,25 Z" fill="#180406" stroke="#f59e0b" stroke-width="1.0" stroke-linejoin="round" />
  <path d="M 42,22 C 34,16 24,15 17,20 C 22,23 30,24 38,24 Z" fill="#991b1b" />
  <!-- Left Horn Spines -->
  <polygon points="26,13 22,7 30,12" fill="#ef4444" />
  <polygon points="36,17 33,10 40,16" fill="#ef4444" />

  <!-- Right Giant Demon Horn -->
  <path d="M 52,22 C 62,14 74,12 82,20 C 78,25 68,26 58,25 Z" fill="#180406" stroke="#f59e0b" stroke-width="1.0" stroke-linejoin="round" />
  <path d="M 54,22 C 62,16 72,15 79,20 C 74,23 66,24 58,24 Z" fill="#450a0a" />
  <!-- Right Horn Spines -->
  <polygon points="70,13 74,7 66,12" fill="#ef4444" />
  <polygon points="60,17 63,10 56,16" fill="#ef4444" />

  <!-- Central Demon Skull Crown Eyelet -->
  <polygon points="48,13 54,18 53,26 48,29 43,26 42,18" fill="#140204" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round" />
  <circle cx="48" cy="22" r="8.5" fill="#090102" stroke="#dc2626" stroke-width="2.0" />
  <circle cx="48" cy="22" r="5.0" fill="#7f1d1d" />
  <circle cx="48" cy="22" r="2.8" fill="#080001" />

  <!-- Demonic Chain Wrapping Skull Neck -->
  <rect x="42" y="27" width="12" height="4" rx="2" fill="#2d060a" stroke="#f59e0b" stroke-width="0.8" />
  <circle cx="39" cy="31" r="2.2" fill="#180406" stroke="#991b1b" stroke-width="0.8" />
  <circle cx="37" cy="36" r="2.0" fill="#180406" stroke="#991b1b" stroke-width="0.8" />

  <!-- 3. Segmented Dragon Vertebrae Spine Shank (Thân Đốt Sống Rồng) -->
  <!-- Dorsal Bone Spines (Gai ngược sau sống lưng) -->
  <polygon points="42,42 32,46 43,50" fill="#dc2626" stroke="#450a0a" stroke-width="0.9" />
  <polygon points="42,56 30,62 43,66" fill="#dc2626" stroke="#450a0a" stroke-width="0.9" />
  <polygon points="43,70 32,77 44,81" fill="#dc2626" stroke="#450a0a" stroke-width="0.9" />

  <!-- Shank Heavy Core Body (Obsidian Underlay) -->
  <path d="M 48,31 L 48,78 Q 48,114 78,114 Q 108,114 108,68 L 94,80" fill="none" stroke="#080102" stroke-width="11.0" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Dark Ruby Spine -->
  <path d="M 48,31 L 48,78 Q 48,114 78,114 Q 108,114 108,68 L 94,80" fill="none" stroke="#450a0a" stroke-width="8.0" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Blood Crimson Vein Core -->
  <path d="M 48,31 L 48,78 Q 48,114 78,114 Q 108,114 108,68 L 94,80" fill="none" stroke="#dc2626" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Razor Sharp Highlights along Edge -->
  <path d="M 50,33 L 50,76 Q 50,110 78,110 Q 105,110 106,70" fill="none" stroke="#fca5a5" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 50,33 L 50,76 Q 50,110 78,110 Q 105,110 106,70" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" />

  <!-- 4 Segmented Vertebrae Rib Plates along Shank -->
  <polygon points="44,38 52,38 50,44 46,44" fill="#f59e0b" stroke="#450a0a" stroke-width="0.6" />
  <polygon points="44,48 52,48 50,54 46,54" fill="#f59e0b" stroke="#450a0a" stroke-width="0.6" />
  <polygon points="44,62 52,62 50,68 46,68" fill="#f59e0b" stroke="#450a0a" stroke-width="0.6" />
  <polygon points="44,74 52,74 50,80 46,80" fill="#f59e0b" stroke="#450a0a" stroke-width="0.6" />

  <!-- Blood Tear Soul Crystal at Shank Center (48, 56) -->
  <polygon points="48,47 55,56 48,65 41,56" fill="#180406" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Crystal Facets -->
  <polygon points="48,48 43,56 48,56" fill="#ef4444" />
  <polygon points="48,48 53,56 48,56" fill="#dc2626" />
  <polygon points="43,56 48,64 48,56" fill="#991b1b" />
  <polygon points="53,56 48,64 48,56" fill="#580812" />
  <circle cx="48" cy="56" r="2.0" fill="#facc15" />

  <!-- 4. Demon Monarch Talon Point & Multi-Barb System -->
  <!-- Primary Vicious Inward Hook Barb (Mũi Vuốt Quỷ Chính) -->
  <polygon points="108,60 90,75 98,82" fill="#180406" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" />
  <polygon points="108,60 92,74 97,79" fill="#ef4444" />
  <polygon points="108,60 95,73 98,76" fill="#ffffff" />

  <!-- Secondary Outer Armor-Piercer Barb (Ngạnh Ngoài Phá Giáp) -->
  <polygon points="110,70 119,79 109,83" fill="#180406" stroke="#991b1b" stroke-width="1.2" stroke-linejoin="round" />
  <polygon points="110,70 117,78 110,81" fill="#dc2626" />
  <polygon points="110,70 115,77 111,79" fill="#fca5a5" />

  <!-- Tertiary Gut-Hook Barb in Bend (Ngạnh Trong Vòm Uốn) -->
  <polygon points="88,96 98,102 91,106" fill="#ef4444" stroke="#450a0a" stroke-width="0.8" />

  <!-- Blood Fuller Groove along Talon -->
  <path d="M 104,65 Q 102,82 92,94" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 104,65 Q 102,82 92,94" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" />

  <!-- 5. Bleeding Crimson Droplets Falling From Talon Point -->
  <circle cx="108" cy="54" r="2.2" fill="#ef4444" />
  <polygon points="108,50 105,55 111,55" fill="#ef4444" />
  <circle cx="108" cy="44" r="1.6" fill="#ef4444" />
  <circle cx="108" cy="35" r="1.2" fill="#ef4444" />

  <!-- 6. Specular Glints & Diamond Sparkles -->
  <circle cx="14" cy="20" r="1.8" fill="#ffffff" />
  <circle cx="82" cy="20" r="1.8" fill="#ffffff" />
  <circle cx="48" cy="14" r="1.5" fill="#ffffff" />
  <circle cx="108" cy="60" r="2.0" fill="#ffffff" />
  <circle cx="119" cy="79" r="1.4" fill="#ffffff" />
  <circle cx="78" cy="114" r="1.8" fill="#ffffff" />
  <circle cx="48" cy="49" r="1.2" fill="#ffffff" />
</svg>
