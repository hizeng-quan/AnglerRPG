<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Solar Corona & Sacred Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(250, 204, 21, 0.16)" />
  <circle cx="64" cy="64" r="40" fill="rgba(254, 240, 138, 0.22)" />

  <!-- 2. Diamond Reliquary Loom Frame (4 Floating Seraph Wing Brackets) -->
  <!-- Top Bracket -->
  <polygon points="64,12 52,28 64,36 76,28" fill="#facc15" stroke="#78350f" stroke-width="1.2" />
  <polygon points="64,15 56,27 64,33 72,27" fill="#ffffff" />
  <!-- Bottom Bracket -->
  <polygon points="64,116 52,100 64,92 76,100" fill="#facc15" stroke="#78350f" stroke-width="1.2" />
  <polygon points="64,113 56,101 64,95 72,101" fill="#ca8a04" />
  <!-- Left Bracket -->
  <polygon points="12,64 28,52 36,64 28,76" fill="#facc15" stroke="#78350f" stroke-width="1.2" />
  <polygon points="15,64 27,56 33,64 27,72" fill="#ffffff" />
  <!-- Right Bracket -->
  <polygon points="116,64 100,52 92,64 100,76" fill="#facc15" stroke="#78350f" stroke-width="1.2" />
  <polygon points="113,64 101,56 95,64 101,72" fill="#ca8a04" />

  <!-- 3. Curved Feather Plumes Connecting Brackets (Diamond Enclosure) -->
  <!-- Top-Left Plume -->
  <polygon points="50,28 28,50 36,54 54,34" fill="#fde047" stroke="#ca8a04" stroke-width="1.0" />
  <polygon points="48,30 32,48 36,50 50,34" fill="#ffffff" />
  <!-- Top-Right Plume -->
  <polygon points="78,28 100,50 92,54 74,34" fill="#fde047" stroke="#ca8a04" stroke-width="1.0" />
  <polygon points="80,30 96,48 92,50 78,34" fill="#ffffff" />
  <!-- Bottom-Left Plume -->
  <polygon points="28,78 50,100 54,94 36,74" fill="#ca8a04" stroke="#78350f" stroke-width="1.0" />
  <!-- Bottom-Right Plume -->
  <polygon points="100,78 78,100 74,94 92,74" fill="#ca8a04" stroke="#78350f" stroke-width="1.0" />

  <!-- 4. Luminous Golden Silk Strands (Weaving Diamond Diamond Pattern) -->
  <line x1="64" y1="26" x2="102" y2="64" stroke="#fef08a" stroke-width="1.6" />
  <line x1="102" y1="64" x2="64" y2="102" stroke="#fef08a" stroke-width="1.6" />
  <line x1="64" y1="102" x2="26" y2="64" stroke="#fef08a" stroke-width="1.6" />
  <line x1="26" y1="64" x2="64" y2="26" stroke="#fef08a" stroke-width="1.6" />
  <!-- Cross-Weave Silk Strands -->
  <line x1="40" y1="40" x2="88" y2="88" stroke="#ffffff" stroke-width="1.0" />
  <line x1="88" y1="40" x2="40" y2="88" stroke="#ffffff" stroke-width="1.0" />

  <!-- 5. Central Spherical Sunstone Core (Hovering Relic Sphere) -->
  <circle cx="64" cy="64" r="22" fill="#78350f" stroke="#ca8a04" stroke-width="1.8" />
  <circle cx="64" cy="64" r="18" fill="#ca8a04" />
  <circle cx="64" cy="64" r="14" fill="#ea580c" />
  <circle cx="64" cy="64" r="9" fill="#facc15" />
  <circle cx="62" cy="62" r="4.5" fill="#ffffff" />

  <!-- 6. Hanging Sun-Drop Pearl Bead -->
  <line x1="64" y1="116" x2="64" y2="124" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="64" cy="124" r="3.0" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" />
  <circle cx="63.5" cy="123.5" r="1.0" fill="#ffffff" />

  <!-- 7. Specular Glints -->
  <circle cx="64" cy="14" r="1.6" fill="#ffffff" />
  <circle cx="14" cy="64" r="1.6" fill="#ffffff" />
  <circle cx="114" cy="64" r="1.6" fill="#ffffff" />
  <circle cx="64" cy="60" r="2.0" fill="#ffffff" />
  <circle cx="50" cy="30" r="1.2" fill="#ffffff" />
  <circle cx="78" cy="30" r="1.2" fill="#ffffff" />
</svg>
