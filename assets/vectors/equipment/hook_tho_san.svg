<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Primal Beast Predator Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(34, 197, 94, 0.16)" />
  <circle cx="64" cy="64" r="42" fill="rgba(180, 83, 9, 0.15)" />

  <!-- 2. Heavy Primal Bone Socket Mount & Eyelet (Top-Left) -->
  <!-- Iron bone socket clamp -->
  <polygon points="32,24 54,20 62,34 38,40" fill="#142616" stroke="#d97706" stroke-width="1.8" />
  <circle cx="44" cy="28" r="4" fill="#020617" stroke="#fbbf24" stroke-width="1.2" />
  <circle cx="43" cy="27" r="1.4" fill="#ffffff" />
  <!-- Rawhide leather criss-cross wraps -->
  <line x1="36" y1="24" x2="48" y2="38" stroke="#78350f" stroke-width="2.2" />
  <line x1="44" y1="22" x2="56" y2="36" stroke="#78350f" stroke-width="2.2" />
  <!-- Dangling Tiger-Eye Fang Charm -->
  <polygon points="56,36 60,52 64,36" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
  <circle cx="60" cy="40" r="1.5" fill="#f59e0b" />

  <!-- 3. Prehistoric Beast Talon Sickle Body (Radical Raptor Talon Silhouette) -->
  <!-- Deep outer shadow / armored spine -->
  <path d="M 44,38 Q 78,44 88,72 Q 94,92 78,106 Q 64,114 46,104 Q 68,96 74,80 Q 78,64 54,42 Z" fill="#142616" stroke="#78350f" stroke-width="1.5" />
  <!-- Ivory Fossil Bone Body -->
  <path d="M 46,39 Q 76,46 84,72 Q 90,90 76,103 Q 64,110 50,103 Q 66,94 72,80 Q 76,64 54,43 Z" fill="#e2e8f0" />
  <!-- Warm Amber Ageing Patina (Bám màu hổ phách cổ vật) -->
  <path d="M 52,43 Q 76,50 82,72 Q 86,86 76,98 Q 72,82 66,70 Q 60,56 52,43 Z" fill="#fef3c7" opacity="0.8" />

  <!-- 4. 3 Wicked Prehistoric Serrations on Outer Curve Spine -->
  <polygon points="68,48 76,40 76,52" fill="#142616" stroke="#d97706" stroke-width="0.8" />
  <polygon points="80,60 90,54 86,66" fill="#142616" stroke="#d97706" stroke-width="0.8" />
  <polygon points="86,76 98,72 90,82" fill="#142616" stroke="#d97706" stroke-width="0.8" />

  <!-- 5. Emerald Venom Blood Fuller Groove -->
  <path d="M 54,44 Q 74,54 78,74 Q 82,88 66,100" fill="none" stroke="#10b981" stroke-width="2.0" stroke-linecap="round" />
  <path d="M 54,44 Q 74,54 78,74 Q 82,88 66,100" fill="none" stroke="#6ee7b7" stroke-width="0.9" stroke-linecap="round" />

  <!-- 6. Sharp Incurved Sickle Talon Tip -->
  <polygon points="46,104 54,98 52,106" fill="#ffffff" />
  <!-- Specular Glints -->
  <circle cx="47" cy="104" r="2.2" fill="#ffffff" />
  <circle cx="90" cy="72" r="1.4" fill="#ffffff" />
  <circle cx="43" cy="27" r="1.2" fill="#ffffff" />
</svg>
