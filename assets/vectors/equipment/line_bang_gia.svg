<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Absolute-Zero Frost Vortex Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(56, 189, 248, 0.22)" />
  <circle cx="64" cy="64" r="44" fill="rgba(37, 99, 235, 0.18)" />

  <!-- 2. Hexagonal Frost Crystal Spool Frame with 6 Ice Horns -->
  <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" fill="#0f172a" stroke="#0284c7" stroke-width="2.2" />
  <polygon points="64,22 100,43 100,85 64,106 28,85 28,43" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.4" />
  <!-- 6 Radial Ice Crystal Horn Tips -->
  <polygon points="64,16 60,8 68,8" fill="#bae6fd" />
  <polygon points="64,112 60,120 68,120" fill="#bae6fd" />
  <polygon points="106,40 114,35 110,45" fill="#bae6fd" />
  <polygon points="106,88 114,93 110,83" fill="#bae6fd" />
  <polygon points="22,40 14,35 18,45" fill="#bae6fd" />
  <polygon points="22,88 14,93 18,83" fill="#bae6fd" />

  <!-- 3. Coiled Superconducting Cryo-Thread -->
  <circle cx="64" cy="64" r="34" fill="#0284c7" />
  <circle cx="64" cy="64" r="30" fill="#38bdf8" />
  <circle cx="64" cy="64" r="26" fill="#7dd3fc" />
  <!-- Shimmering Crystalline Winding Rings -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="#e0f2fe" stroke-width="1.2" />
  <circle cx="64" cy="64" r="28" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9" />
  <circle cx="64" cy="64" r="24" fill="none" stroke="#0284c7" stroke-width="1" />

  <!-- 4. Center Hexagonal Diamond Ice Core & Snowflake Facets -->
  <polygon points="64,48 78,56 78,72 64,80 50,72 50,56" fill="#0369a1" stroke="#bae6fd" stroke-width="1.4" />
  <polygon points="64,52 74,58 74,70 64,76 54,70 54,58" fill="#38bdf8" />
  <!-- Center Crystalline Star -->
  <line x1="64" y1="56" x2="64" y2="72" stroke="#ffffff" stroke-width="1.5" />
  <line x1="57" y1="60" x2="71" y2="68" stroke="#ffffff" stroke-width="1.5" />
  <line x1="57" y1="68" x2="71" y2="60" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="64" cy="64" r="2.5" fill="#ffffff" />

  <!-- 5. Dangling Icicle Thread Strand with Frost Droplet -->
  <path d="M 88,48 Q 106,44 110,24 Q 112,12 98,16" fill="none" stroke="#e0f2fe" stroke-width="1.8" />
  <polygon points="98,16 94,10 102,12" fill="#38bdf8" />
  <!-- Pure Diamond Specular Glints -->
  <circle cx="98" cy="16" r="1.8" fill="#ffffff" />
  <circle cx="64" cy="8" r="1.5" fill="#ffffff" />
  <circle cx="64" cy="64" r="1.5" fill="#ffffff" />
</svg>
