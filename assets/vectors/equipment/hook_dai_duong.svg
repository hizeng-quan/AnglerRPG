<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Deep-Sea Leviathan Jaw & Oceanic Swirl Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(6, 182, 212, 0.20)" />
  <circle cx="64" cy="64" r="42" fill="rgba(3, 105, 161, 0.18)" />

  <!-- 2. Crown Eyelet: Whale-Tail Fluke / Dolphin Nautical Crest (Top-Left) -->
  <path d="M 32,24 Q 44,32 44,38 Q 44,32 56,24 Q 48,20 44,26 Q 40,20 32,24 Z" fill="#d97706" stroke="#fbbf24" stroke-width="1.2" />
  <circle cx="44" cy="34" r="5" fill="#082f49" stroke="#fbbf24" stroke-width="1.4" />
  <circle cx="44" cy="34" r="2.5" fill="#0284c7" />
  <circle cx="42.5" cy="32.5" r="1.2" fill="#ffffff" />

  <!-- 3. Ancient Leviathan Jaw Tooth Shank & Sweeping Marine Curve -->
  <!-- Deep cobalt armor spine -->
  <path d="M 44,38 L 44,78 Q 44,106 72,106 Q 100,106 98,76 L 96,54" fill="none" stroke="#082f49" stroke-width="8.5" stroke-linecap="round" />
  <!-- Ancient Leviathan Ivory Tooth Blade -->
  <path d="M 44,38 L 44,78 Q 44,106 72,106 Q 100,106 98,76 L 96,54" fill="none" stroke="#0284c7" stroke-width="5.5" stroke-linecap="round" />
  <!-- Bioluminescent Seafoam Vein -->
  <path d="M 44,38 L 44,78 Q 44,106 72,106 Q 100,106 98,76 L 96,54" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round" />
  <!-- Specular blade rim -->
  <path d="M 45,38 L 45,78 Q 45,104 72,104 Q 99,104 97,76 L 95,56" fill="none" stroke="#ffffff" stroke-width="0.9" />

  <!-- 4. 2 Dorsal Shark/Manta Wave Fins protruding backwards on Shank -->
  <polygon points="44,50 28,58 44,62" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
  <polygon points="44,66 26,76 44,80" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
  <circle cx="28" cy="58" r="1" fill="#67e8f9" />
  <circle cx="26" cy="76" r="1" fill="#67e8f9" />

  <!-- 5. Massive Neptune Tidal Trident Wave Harpoon Point (Right) -->
  <!-- Center Harpoon Spearhead -->
  <polygon points="96,54 90,68 102,68" fill="#0284c7" stroke="#67e8f9" stroke-width="1" />
  <!-- Razor Sharp Ivory Spear Point -->
  <polygon points="96,44 91,56 101,56" fill="#f0f9ff" />
  <!-- Outer Tidal Wave Hook Flukes (Ngạnh sóng kép đối xứng) -->
  <path d="M 96,66 Q 84,68 86,78 Q 94,76 96,70" fill="#0ea5e9" stroke="#bae6fd" stroke-width="0.8" />
  <path d="M 96,66 Q 108,68 106,78 Q 98,76 96,70" fill="#0ea5e9" stroke="#bae6fd" stroke-width="0.8" />

  <!-- 6. Dangling Luminescent Angler-Fish Lure Pearl Charm -->
  <line x1="44" y1="42" x2="30" y2="48" stroke="#fbbf24" stroke-width="1.2" />
  <circle cx="28" cy="49" r="4" fill="#f8fafc" stroke="#06b6d4" stroke-width="1" />
  <circle cx="27" cy="48" r="1.5" fill="#ffffff" />

  <!-- 7. Specular Glints -->
  <circle cx="96" cy="44" r="2.2" fill="#ffffff" />
  <circle cx="44" cy="32" r="1.4" fill="#ffffff" />
  <circle cx="72" cy="104" r="1.6" fill="#ffffff" />
</svg>
