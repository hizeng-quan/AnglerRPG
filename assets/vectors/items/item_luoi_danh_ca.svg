<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="netAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="netMeshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <ellipse cx="64" cy="68" rx="46" ry="32" fill="url(#netAura)"/>
    <ellipse cx="64" cy="106" rx="42" ry="10" fill="#000000" opacity="0.4"/>
  </g>

  <!-- LAYER 2: Base Form (Conical Net Cone Silhouette & Central Pull Ring) -->
  <g id="base_form">
    <!-- Conical Mesh Body Cone (Shaded volume) -->
    <path d="M 64 24 Q 92 64 104 96 Q 64 106 24 96 Q 36 64 64 24 Z" fill="#0369a1" opacity="0.35"/>

    <!-- Heavy Braided Border Perimeter Line -->
    <path d="M 64 24 Q 92 64 104 96 Q 64 106 24 96 Q 36 64 64 24 Z" fill="none" stroke="#0284c7" stroke-width="2.5"/>

    <!-- Central Brass Retrieval Pull Horn & Ring at Apex -->
    <circle cx="64" cy="20" r="8" fill="#ca8a04"/>
    <circle cx="64" cy="20" r="4.5" fill="#0f172a"/>
  </g>

  <!-- LAYER 3: Details & Relief (Diamond Mesh Lattice Grid & Weighted Lead Sinkers) -->
  <g id="details_and_relief">
    <!-- Radial Net Lines radiating from horn -->
    <line x1="64" y1="24" x2="26" y2="96" stroke="url(#netMeshGrad)" stroke-width="1.4"/>
    <line x1="64" y1="24" x2="42" y2="100" stroke="url(#netMeshGrad)" stroke-width="1.4"/>
    <line x1="64" y1="24" x2="56" y2="103" stroke="url(#netMeshGrad)" stroke-width="1.4"/>
    <line x1="64" y1="24" x2="72" y2="103" stroke="url(#netMeshGrad)" stroke-width="1.4"/>
    <line x1="64" y1="24" x2="86" y2="100" stroke="url(#netMeshGrad)" stroke-width="1.4"/>
    <line x1="64" y1="24" x2="102" y2="96" stroke="url(#netMeshGrad)" stroke-width="1.4"/>

    <!-- Concentric Net Mesh Arcs -->
    <path d="M 46 54 Q 64 60 82 54" fill="none" stroke="url(#netMeshGrad)" stroke-width="1.4"/>
    <path d="M 36 72 Q 64 80 92 72" fill="none" stroke="url(#netMeshGrad)" stroke-width="1.4"/>
    <path d="M 28 88 Q 64 98 100 88" fill="none" stroke="url(#netMeshGrad)" stroke-width="1.6"/>

    <!-- Weighted Lead Sinkers (Quả chì viền lưới) -->
    <circle cx="24" cy="96" r="4.0" fill="#475569"/>
    <circle cx="38" cy="100" r="4.0" fill="#475569"/>
    <circle cx="52" cy="103" r="4.0" fill="#475569"/>
    <circle cx="64" cy="104" r="4.0" fill="#475569"/>
    <circle cx="76" cy="103" r="4.0" fill="#475569"/>
    <circle cx="90" cy="100" r="4.0" fill="#475569"/>
    <circle cx="104" cy="96" r="4.0" fill="#475569"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Lead Beads Gloss & Wet Nylon Glimmer) -->
  <g id="specular_highlights">
    <!-- Lead Sinker Highlights -->
    <circle cx="23" cy="95" r="1.2" fill="#ffffff"/>
    <circle cx="51" cy="102" r="1.2" fill="#ffffff"/>
    <circle cx="63" cy="103" r="1.2" fill="#ffffff"/>
    <circle cx="75" cy="102" r="1.2" fill="#ffffff"/>
    <circle cx="103" cy="95" r="1.2" fill="#ffffff"/>
    <!-- Top Brass Ring Sparkle -->
    <circle cx="62" cy="16" r="1.5" fill="#ffffff"/>
    <path d="M 52 44 Q 64 48 76 44" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  </g>
</svg>