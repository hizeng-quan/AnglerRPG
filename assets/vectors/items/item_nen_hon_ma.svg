<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="ghostFlameAura" cx="50%" cy="32%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waxColumn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ghostFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="34" r="48" fill="url(#ghostFlameAura)"/>
    <!-- Ritual Candle Shadow Platform -->
    <ellipse cx="64" cy="116" rx="36" ry="8" fill="#000000" opacity="0.45"/>
    <ellipse cx="64" cy="114" rx="28" ry="5" fill="#0369a1" opacity="0.25"/>
  </g>

  <!-- LAYER 2: Base Form (White Wax Candle Body & Dripping Wax Tears) -->
  <g id="base_form">
    <!-- Candle Wax Cylinder -->
    <rect x="50" y="48" width="28" height="64" rx="3" fill="url(#waxColumn)"/>
    <!-- Bottom Rim -->
    <ellipse cx="64" cy="112" rx="14" ry="4" fill="#94a3b8"/>

    <!-- Melted Wax Top Basin -->
    <ellipse cx="64" cy="48" rx="14" ry="5" fill="#f1f5f9"/>
    <ellipse cx="64" cy="49" rx="12" ry="4" fill="#cbd5e1"/>

    <!-- Dripping Wax Tears along Sides -->
    <path d="M 50 54 Q 46 68 47 74 Q 50 76 50 72 Z" fill="#f1f5f9"/>
    <circle cx="48" cy="74" r="2.5" fill="#f1f5f9"/>

    <path d="M 78 58 Q 82 72 81 80 Q 78 82 78 76 Z" fill="#f1f5f9"/>
    <circle cx="80" cy="80" r="2.2" fill="#f1f5f9"/>

    <path d="M 58 52 Q 56 62 57 66 Q 60 67 60 62 Z" fill="#ffffff"/>
  </g>

  <!-- LAYER 3: Details & Relief (Charred Wick, Ghostly Guardian Ring, Blue Soul Flame) -->
  <g id="details_and_relief">
    <!-- Twisted Black Wick -->
    <path d="M 64 48 Q 63 42 66 38" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Tear-drop Ethereal Cyan Soul Flame -->
    <path d="M 54 36 C 52 24 64 12 64 8 C 64 12 76 24 74 36 C 72 44 56 44 54 36 Z" fill="url(#ghostFlame)"/>
    <!-- Inner White Core Flame -->
    <path d="M 58 36 C 57 28 64 20 64 16 C 64 20 71 28 70 36 C 68 40 60 40 58 36 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Guardian Ethereal Wisp Sparkles around Flame -->
    <circle cx="48" cy="24" r="2.0" fill="#7dd3fc" opacity="0.8"/>
    <circle cx="80" cy="20" r="1.5" fill="#7dd3fc" opacity="0.8"/>
    <circle cx="52" cy="14" r="1.2" fill="#bae6fd" opacity="0.9"/>
  </g>

  <!-- LAYER 4: Specular Highlights & Contrast -->
  <g id="specular_highlights">
    <!-- Candle Body Left Rim Highlight -->
    <line x1="53" y1="52" x2="53" y2="108" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <!-- Liquid Wax Specular Sparkle in Basin -->
    <circle cx="60" cy="48" r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>

