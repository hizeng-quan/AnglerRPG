<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="overdriveAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plasmaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="brassCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="72" r="44" fill="url(#overdriveAura)"/>
    <ellipse cx="64" cy="108" rx="30" ry="8" fill="#000000" opacity="0.45"/>
  </g>

  <!-- LAYER 2: Base Form (Conical Erlenmeyer Flask & Molten Core) -->
  <g id="base_form">
    <!-- Conical Glass Flask Body (Wide flat base, narrow neck) -->
    <polygon points="56,36 72,36 94,100 34,100" fill="#1e293b" opacity="0.6"/>
    <!-- Swirling Molten Overdrive Plasma Liquid -->
    <polygon points="58,60 70,60 90,98 38,98" fill="url(#plasmaLiquid)"/>
    <ellipse cx="64" cy="98" rx="26" ry="6" fill="#991b1b"/>
    <!-- Glass Flask Neck & Flange -->
    <rect x="56" y="24" width="16" height="16" fill="#334155"/>
    <rect x="54" y="20" width="20" height="5" rx="1.5" fill="#64748b"/>
    <!-- Golden Stopper Gem -->
    <polygon points="64,10 70,20 58,20" fill="#facc15"/>
  </g>

  <!-- LAYER 3: Details & Relief (Heavy Riveted Brass Collar & Swirling Runes) -->
  <g id="details_and_relief">
    <!-- Heavy Brass Collar Around Flask Neck -->
    <rect x="53" y="32" width="22" height="6" rx="1" fill="url(#brassCollar)"/>
    <circle cx="56" cy="35" r="1.2" fill="#451a03"/>
    <circle cx="64" cy="35" r="1.2" fill="#451a03"/>
    <circle cx="72" cy="35" r="1.2" fill="#451a03"/>

    <!-- Plasma Energy Vortex Core (Swirling heat particles) -->
    <circle cx="64" cy="78" r="9" fill="#fde047"/>
    <circle cx="64" cy="78" r="5" fill="#ffffff"/>
    <polygon points="52,86 58,82 54,90" fill="#fef08a"/>
    <polygon points="74,72 78,78 72,80" fill="#fef08a"/>

    <!-- Glass Measurement Graduations on Side -->
    <line x1="42" y1="84" x2="48" y2="84" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="47" y1="74" x2="52" y2="74" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="52" y1="64" x2="56" y2="64" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Conical Flask Ridge Highlights) -->
  <g id="specular_highlights">
    <!-- Left Conical Edge Glass Reflection -->
    <line x1="56" y1="36" x2="38" y2="96" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <!-- Neck High Gloss -->
    <line x1="58" y1="24" x2="58" y2="36" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <!-- Molten Core White Hot Point -->
    <circle cx="64" cy="78" r="2.5" fill="#ffffff"/>
    <circle cx="64" cy="12" r="1.2" fill="#ffffff"/>
  </g>
</svg>