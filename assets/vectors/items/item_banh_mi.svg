<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="breadAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <ellipse cx="64" cy="68" rx="46" ry="28" fill="url(#breadAura)"/>
    <ellipse cx="64" cy="86" rx="42" ry="12" fill="#000000" opacity="0.35"/>
  </g>

  <!-- LAYER 2: Base Form (Loaf Ellipse & Golden Crust) -->
  <g id="base_form">
    <!-- Main Baked Loaf Body -->
    <ellipse cx="64" cy="68" rx="44" ry="26" fill="url(#crustGrad)"/>
    <!-- Golden Top Expansion Crust -->
    <ellipse cx="64" cy="64" rx="40" ry="21" fill="#f59e0b"/>
    <!-- Warm Bread Belly Core -->
    <ellipse cx="64" cy="62" rx="36" ry="16" fill="url(#crumbGrad)"/>
  </g>

  <!-- LAYER 3: Details & Relief (Score Cuts, Flour Dust & Butter Patches) -->
  <g id="details_and_relief">
    <!-- Artisan Diagonal Score Cuts -->
    <line x1="44" y1="50" x2="52" y2="74" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="60" y1="50" x2="68" y2="74" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="76" y1="50" x2="84" y2="74" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Score expansion gaps showing tender crumb inside -->
    <line x1="44" y1="52" x2="51" y2="72" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="60" y1="52" x2="67" y2="72" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="76" y1="52" x2="83" y2="72" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Golden melted butter gloss spots -->
    <ellipse cx="48" cy="62" rx="3" ry="1.5" fill="#facc15"/>
    <ellipse cx="64" cy="62" rx="3.5" ry="2" fill="#facc15"/>
    <ellipse cx="80" cy="62" rx="3" ry="1.5" fill="#facc15"/>

    <!-- Flour dust sprinkles -->
    <circle cx="36" cy="60" r="1.5" fill="#fef9c3"/>
    <circle cx="92" cy="60" r="1.5" fill="#fef9c3"/>
    <circle cx="56" cy="56" r="1.2" fill="#fef9c3"/>
    <circle cx="72" cy="56" r="1.2" fill="#fef9c3"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Crisp Crust Glint) -->
  <g id="specular_highlights">
    <!-- Golden Gloss Rim along Top Crust -->
    <path d="M 38 56 Q 64 48 90 56" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85" stroke-linecap="round"/>
    <!-- Specular Highlight Dots on Butter Glaze -->
    <circle cx="63" cy="61" r="1.2" fill="#ffffff"/>
    <circle cx="47" cy="61" r="1.0" fill="#ffffff"/>
    <circle cx="79" cy="61" r="1.0" fill="#ffffff"/>
  </g>
</svg>