<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="magAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redHorseshoe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="44" fill="url(#magAura)"/>
    <ellipse cx="64" cy="110" rx="34" ry="8" fill="#000000" opacity="0.35"/>
  </g>

  <!-- LAYER 2: Base Form (Horseshoe U-Shape Body & Silver Poles) -->
  <g id="base_form">
    <!-- Main Red Horseshoe Arch (Outer arc down to poles, inner cutout) -->
    <path d="M 28 84 L 28 54 Q 28 20 64 20 Q 100 20 100 54 L 100 84 L 82 84 L 82 54 Q 82 38 64 38 Q 46 38 46 54 L 46 84 Z" fill="url(#redHorseshoe)"/>

    <!-- Left Magnetic Pole (Silver North Pole) -->
    <rect x="28" y="80" width="18" height="18" rx="2" fill="#e2e8f0"/>
    <rect x="28" y="94" width="18" height="4" fill="#94a3b8"/>

    <!-- Right Magnetic Pole (Silver South Pole) -->
    <rect x="82" y="80" width="18" height="18" rx="2" fill="#e2e8f0"/>
    <rect x="82" y="94" width="18" height="4" fill="#94a3b8"/>
  </g>

  <!-- LAYER 3: Details & Relief (N/S Stamping, Electromagnetic Field Waves, Gold Coins Attracted) -->
  <g id="details_and_relief">
    <!-- Pole Indicators N & S -->
    <line x1="33" y1="84" x2="33" y2="92" stroke="#dc2626" stroke-width="2.0"/>
    <line x1="33" y1="84" x2="41" y2="92" stroke="#dc2626" stroke-width="2.0"/>
    <line x1="41" y1="84" x2="41" y2="92" stroke="#dc2626" stroke-width="2.0"/>

    <path d="M 87 92 Q 91 92 91 88 Q 87 88 87 84 Q 91 84 91 84" fill="none" stroke="#2563eb" stroke-width="2.0"/>

    <!-- Blue Electromagnetic Attraction Waves Across Poles -->
    <path d="M 46 90 Q 64 102 82 90" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 46 96 Q 64 110 82 96" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Floating Attracted Golden Coins & Relics -->
    <circle cx="64" cy="98" r="6" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="64" cy="98" r="4" fill="#fef08a"/>
    <circle cx="54" cy="106" r="4" fill="#facc15"/>
    <circle cx="74" cy="106" r="4" fill="#facc15"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Glossy Enamel Sheen) -->
  <g id="specular_highlights">
    <!-- Red Arch Gloss Stripe along Left Contour -->
    <path d="M 32 80 L 32 54 Q 32 24 64 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Pole Corners Glint -->
    <circle cx="30" cy="82" r="1.5" fill="#ffffff"/>
    <circle cx="84" cy="82" r="1.5" fill="#ffffff"/>
    <circle cx="63" cy="97" r="1.2" fill="#ffffff"/>
  </g>
</svg>