<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="talismanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="46" fill="url(#talismanAura)"/>
    <polygon points="46,24 82,24 86,112 42,112" fill="#000000" opacity="0.35"/>
  </g>

  <!-- LAYER 2: Base Form (Rectangular Gold Parchment & Crimson Borders) -->
  <g id="base_form">
    <!-- Top Jade Fastener Bead -->
    <circle cx="64" cy="16" r="6" fill="#059669"/>
    <circle cx="64" cy="16" r="3" fill="#34d399"/>
    <!-- Silk Tassel Cord -->
    <line x1="64" y1="16" x2="64" y2="28" stroke="#dc2626" stroke-width="3.0"/>

    <!-- Main Golden Paper Talisman Body -->
    <polygon points="46,26 82,26 82,108 46,108" fill="url(#goldParchment)"/>
    <!-- Outer Crimson Border Frame -->
    <polygon points="48,28 80,28 80,106 48,106" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
    <polygon points="51,31 77,31 77,103 51,103" fill="none" stroke="#dc2626" stroke-width="1.0"/>
  </g>

  <!-- LAYER 3: Details & Relief (Cinnabar Runes, Dragon Header & Incantation Seal) -->
  <g id="details_and_relief">
    <!-- Taoist Three-Mountain Dragon Crown Header at Top -->
    <path d="M 54 36 L 64 32 L 74 36 L 64 40 Z" fill="#991b1b"/>
    <circle cx="64" cy="36" r="2.5" fill="#fde047"/>

    <!-- Sacred Cinnabar (Chu Sa) Rune Inscriptions -->
    <line x1="64" y1="42" x2="64" y2="62" stroke="#dc2626" stroke-width="3.0" stroke-linecap="round"/>
    <path d="M 56 48 Q 64 52 72 48" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 58 56 Q 64 60 70 56" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Central Imperial Dragon Pearl Seal -->
    <circle cx="64" cy="72" r="7" fill="#b91c1c"/>
    <circle cx="64" cy="72" r="4.5" fill="#facc15"/>
    <circle cx="64" cy="72" r="2" fill="#b91c1c"/>

    <!-- Flowing Mystic Talisman Tail Glyphs -->
    <path d="M 58 84 Q 64 80 70 84 Q 64 88 58 92 Q 64 96 70 96" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Bottom Swallowtail Ribbon Cuts -->
    <polygon points="46,108 55,102 64,108 73,102 82,108 82,104 46,104" fill="#b91c1c"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Golden Foil Foil Radiance) -->
  <g id="specular_highlights">
    <!-- Gold Paper Vertical Sheen -->
    <line x1="50" y1="30" x2="50" y2="104" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Jade Bead Top Highlight -->
    <circle cx="63" cy="14" r="1.5" fill="#ffffff"/>
    <!-- Central Seal Core Star -->
    <circle cx="63" cy="71" r="1.2" fill="#ffffff"/>
    <polygon points="64,28 66,32 62,32" fill="#ffffff"/>
  </g>
</svg>