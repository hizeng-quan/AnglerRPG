<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="lineAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titanSpool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="kevlarThread" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="44" fill="url(#lineAura)"/>
    <ellipse cx="64" cy="106" rx="32" ry="8" fill="#000000" opacity="0.4"/>
  </g>

  <!-- LAYER 2: Base Form (Heavy Duty Titan Spool & Braided Blue Line Core) -->
  <g id="base_form">
    <!-- Left & Right Flange Plates (Bản vành hợp kim Titan) -->
    <ellipse cx="36" cy="64" rx="10" ry="34" fill="url(#titanSpool)"/>
    <ellipse cx="92" cy="64" rx="10" ry="34" fill="url(#titanSpool)"/>

    <!-- Spool Inner Barrel with Wound Blue Kevlar Line -->
    <rect x="36" y="34" width="56" height="60" fill="url(#kevlarThread)"/>

    <!-- Right Flange Outer Face -->
    <ellipse cx="92" cy="64" rx="8" ry="32" fill="#334155"/>
    <ellipse cx="92" cy="64" rx="4" ry="16" fill="#0f172a"/>
  </g>

  <!-- LAYER 3: Details & Relief (Braided Thread Texture, Brass Clip, 4-Spoke Flange) -->
  <g id="details_and_relief">
    <!-- Braided Cord Texture Ridges -->
    <line x1="38" y1="42" x2="90" y2="42" stroke="#bae6fd" stroke-width="1.8"/>
    <line x1="38" y1="50" x2="90" y2="50" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="38" y1="58" x2="90" y2="58" stroke="#bae6fd" stroke-width="1.8"/>
    <line x1="38" y1="66" x2="90" y2="66" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="38" y1="74" x2="90" y2="74" stroke="#bae6fd" stroke-width="1.8"/>
    <line x1="38" y1="82" x2="90" y2="82" stroke="#0369a1" stroke-width="1.5"/>

    <!-- Reinforced Spool End Spoke Arms on Right -->
    <line x1="92" y1="36" x2="92" y2="92" stroke="#94a3b8" stroke-width="3.0"/>
    <line x1="86" y1="64" x2="98" y2="64" stroke="#94a3b8" stroke-width="3.0"/>

    <!-- Brass Line Fastener Clip -->
    <rect x="74" y="56" width="6" height="16" rx="2" fill="#f59e0b"/>
    <circle cx="77" cy="64" r="1.5" fill="#fef08a"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Chiseled Titanium Flange Sheen) -->
  <g id="specular_highlights">
    <!-- Left Flange Metallic Rim Curve -->
    <path d="M 30 38 Q 24 64 30 90" fill="none" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round" opacity="0.9"/>
    <!-- Thread Surface Glimmer -->
    <line x1="42" y1="38" x2="84" y2="38" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <!-- Center Axle Glint -->
    <circle cx="92" cy="64" r="1.5" fill="#ffffff"/>
  </g>
</svg>