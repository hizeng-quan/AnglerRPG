<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="activeSpellAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crimsonCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="44" fill="url(#activeSpellAura)"/>
    <ellipse cx="64" cy="112" rx="34" ry="8" fill="#000000" opacity="0.4"/>
  </g>

  <!-- LAYER 2: Base Form (Thick Dragon-Leather Tome & Golden Pages) -->
  <g id="base_form">
    <!-- Main Leather Book Cover -->
    <rect x="36" y="24" width="56" height="74" rx="4" fill="url(#crimsonCover)"/>
    <!-- Aged Gold Parchment Page Block Edge -->
    <rect x="86" y="28" width="8" height="66" rx="1" fill="#fde047"/>
    <!-- Page Block Shading Ribs -->
    <line x1="88" y1="32" x2="88" y2="90" stroke="#ca8a04" stroke-width="1"/>
    <line x1="91" y1="32" x2="91" y2="90" stroke="#ca8a04" stroke-width="1"/>
  </g>

  <!-- LAYER 3: Details & Relief (Gold Corner Brackets, Sword Crest & Ribbon) -->
  <g id="details_and_relief">
    <!-- 4 Ornate Engraved Gold Corner Brackets -->
    <polygon points="36,24 50,24 36,38" fill="#facc15"/>
    <polygon points="86,24 72,24 86,38" fill="#facc15"/>
    <polygon points="36,98 50,98 36,84" fill="#facc15"/>
    <polygon points="86,98 72,98 86,84" fill="#facc15"/>

    <!-- Golden Sword & Thunder Crest on Cover -->
    <circle cx="61" cy="58" r="18" fill="#450a0a"/>
    <circle cx="61" cy="58" r="15" fill="#facc15"/>
    <!-- Upright Sword -->
    <polygon points="60,46 62,46 62,64 60,64" fill="#ffffff"/>
    <polygon points="61,42 63,46 59,46" fill="#ffffff"/>
    <line x1="56" y1="64" x2="66" y2="64" stroke="#ca8a04" stroke-width="2.5"/>
    <circle cx="61" cy="68" r="2" fill="#ca8a04"/>

    <!-- Silken Red Bookmark Ribbon Hanging from Bottom -->
    <polygon points="68,96 76,96 76,118 72,112 68,118" fill="#dc2626"/>
    <line x1="68" y1="96" x2="76" y2="96" stroke="#facc15" stroke-width="2"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Gold Filigree Glint & Leather Sheen) -->
  <g id="specular_highlights">
    <!-- Spine Leather Reflection -->
    <line x1="39" y1="26" x2="39" y2="96" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Corner Bracket Gold Glint -->
    <circle cx="42" cy="28" r="1.5" fill="#ffffff"/>
    <circle cx="80" cy="28" r="1.5" fill="#ffffff"/>
    <!-- Crest Center Glint -->
    <circle cx="61" cy="46" r="1.5" fill="#ffffff"/>
  </g>
</svg>
