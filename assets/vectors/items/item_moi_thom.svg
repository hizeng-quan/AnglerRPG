<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="sweetAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassJar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#bef264" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="44" fill="url(#sweetAura)"/>
    <ellipse cx="64" cy="112" rx="28" ry="7" fill="#000000" opacity="0.35"/>
  </g>

  <!-- LAYER 2: Base Form (Glass Bait Jar, Cork Lid & Twine Tie) -->
  <g id="base_form">
    <!-- Cylindrical Glass Bait Jar Body -->
    <rect x="42" y="42" width="44" height="58" rx="6" fill="url(#glassJar)"/>
    <!-- Glass Jar Thick Lip Rim -->
    <rect x="40" y="36" width="48" height="8" rx="2" fill="#84cc16" opacity="0.8"/>
    <!-- Wooden Cork Stopper -->
    <polygon points="46,36 82,36 78,22 50,22" fill="#92400e"/>
    <!-- Twine String Wrapped Around Neck -->
    <rect x="42" y="40" width="44" height="4" rx="1" fill="#d97706"/>
  </g>

  <!-- LAYER 3: Details & Relief (Aroma Dough Pellets & Sweet Scent Star) -->
  <g id="details_and_relief">
    <!-- Golden-Green Herbal Dough Lumps Inside -->
    <circle cx="54" cy="74" r="9" fill="#a3e635"/>
    <circle cx="72" cy="72" r="10" fill="#84cc16"/>
    <circle cx="64" cy="86" r="11" fill="#65a30d"/>
    <!-- Dough Texture Dots -->
    <circle cx="53" cy="73" r="1.5" fill="#fef08a"/>
    <circle cx="71" cy="71" r="1.5" fill="#fef08a"/>
    <!-- Hanging Wooden Tag with Sweet Star Icon -->
    <polygon points="76,44 86,54 80,64 70,54" fill="#b45309"/>
    <polygon points="76,51 77,53 80,53 78,55 79,57 76,56 73,57 74,55 72,53 75,53" fill="#facc15"/>
    <!-- Scent Vapor Vanes Floating Out -->
    <path d="M 52 20 Q 48 10 56 6" fill="none" stroke="#bef264" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 76 20 Q 80 12 74 6" fill="none" stroke="#bef264" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Glass Curved Sheen) -->
  <g id="specular_highlights">
    <!-- Left Glass Specular Stripe -->
    <line x1="46" y1="46" x2="46" y2="94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Cork Edge Highlight -->
    <line x1="52" y1="24" x2="76" y2="24" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <!-- Tag Glint -->
    <circle cx="76" cy="54" r="1.2" fill="#ffffff"/>
  </g>
</svg>
