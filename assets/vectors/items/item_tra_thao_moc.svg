<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="teaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceramicCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="greenTeaLiquid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <ellipse cx="64" cy="76" rx="42" ry="24" fill="url(#teaAura)"/>
    <ellipse cx="64" cy="102" rx="36" ry="10" fill="#000000" opacity="0.35"/>
  </g>

  <!-- LAYER 2: Base Form (Zen Ceramic Saucer, Teacup & Steaming Tea) -->
  <g id="base_form">
    <!-- Ceramic Saucer (Đĩa lót chén) -->
    <ellipse cx="64" cy="94" rx="42" ry="12" fill="url(#ceramicCup)"/>
    <ellipse cx="64" cy="93" rx="36" ry="9" fill="#059669" opacity="0.3"/>

    <!-- Ceramic Teacup Body (Chén trà) -->
    <path d="M 36 60 Q 38 88 64 88 Q 90 88 92 60 Z" fill="url(#ceramicCup)"/>
    <ellipse cx="64" cy="60" rx="28" ry="10" fill="#cbd5e1"/>

    <!-- Green Tea Liquid Surface -->
    <ellipse cx="64" cy="61" rx="25" ry="8" fill="url(#greenTeaLiquid)"/>
  </g>

  <!-- LAYER 3: Details & Relief (Floating Tea Leaves, Gold Ceramic Inlay, Rising Steam) -->
  <g id="details_and_relief">
    <!-- Floating Tender Green Tea Leaves -->
    <path d="M 54 60 Q 60 56 66 60 Q 60 64 54 60 Z" fill="#065f46"/>
    <line x1="55" y1="60" x2="65" y2="60" stroke="#34d399" stroke-width="0.8"/>
    <path d="M 68 62 Q 74 59 78 63 Q 73 66 68 62 Z" fill="#047857"/>

    <!-- Golden Kintsugi Inlay Line on Cup -->
    <path d="M 44 66 Q 48 78 56 86" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="56" cy="86" r="1.5" fill="#fde047"/>

    <!-- Gentle Aromatherapeutic Rising Steam Wisps -->
    <path d="M 52 50 Q 48 40 54 32 Q 58 24 54 16" fill="none" stroke="#6ee7b7" stroke-width="2.0" stroke-linecap="round" opacity="0.6"/>
    <path d="M 64 48 Q 70 38 64 28 Q 60 18 66 10" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 76 52 Q 82 42 76 34 Q 72 26 78 18" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Glazed Porcelain Gloss) -->
  <g id="specular_highlights">
    <!-- Cup Left Gloss Arc -->
    <path d="M 38 62 Q 40 82 56 86" fill="none" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round" opacity="0.9"/>
    <!-- Tea Surface Glint -->
    <ellipse cx="74" cy="59" rx="2.5" ry="1.0" fill="#ffffff" opacity="0.85"/>
    <!-- Saucer Rim Edge Specular -->
    <path d="M 32 94 Q 64 104 96 94" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  </g>
</svg>