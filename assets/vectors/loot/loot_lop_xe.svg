<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="tireAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tireBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="44" fill="url(#tireAura)"/>
    <ellipse cx="64" cy="112" rx="30" ry="8" fill="#000000" opacity="0.4"/>
  </g>

  <!-- LAYER 2: Base Form (Thick Rubber Outer Torus & Hollow Rim Opening) -->
  <g id="base_form">
    <!-- Outer Heavy Tire Disc -->
    <circle cx="64" cy="64" r="38" fill="url(#tireBody)"/>
    <!-- Outer Tread Ring -->
    <circle cx="64" cy="64" r="34" fill="#1e293b"/>
    <!-- Inner Rim Aperture -->
    <circle cx="64" cy="64" r="20" fill="#0f172a"/>
    <!-- Submerged Water In Hollow -->
    <circle cx="64" cy="64" r="16" fill="#022c22"/>
  </g>

  <!-- LAYER 3: Details & Relief (Radial Tread Notches & Clinging Pond Weed) -->
  <g id="details_and_relief">
    <!-- 8 Deep Tread Cuts along Circumference -->
    <rect x="62" y="26" width="4" height="6" fill="#020617"/>
    <rect x="62" y="96" width="4" height="6" fill="#020617"/>
    <rect x="26" y="62" width="6" height="4" fill="#020617"/>
    <rect x="96" y="62" width="6" height="4" fill="#020617"/>
    <rect x="37" y="37" width="5" height="5" fill="#020617"/>
    <rect x="86" y="37" width="5" height="5" fill="#020617"/>
    <rect x="37" y="86" width="5" height="5" fill="#020617"/>
    <rect x="86" y="86" width="5" height="5" fill="#020617"/>

    <!-- Tangled Pond Seaweed Strands -->
    <path d="M 46 32 Q 40 18 34 16" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 84 84 Q 96 98 102 96" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="34" cy="16" r="3" fill="#22c55e"/>
    <circle cx="102" cy="96" r="2.5" fill="#22c55e"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Rubber Shoulder Sheen) -->
  <g id="specular_highlights">
    <!-- Arc Upper-Left Shoulder Gloss -->
    <path d="M 38 52 A 30 30 0 0 1 52 38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Inner Rim Edge Glint -->
    <path d="M 50 64 A 18 18 0 0 1 64 50" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <!-- Water Dew on Seaweed -->
    <circle cx="37" cy="22" r="1.2" fill="#ffffff"/>
  </g>
</svg>
