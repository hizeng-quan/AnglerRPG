<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="ringAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Glow -->
  <g id="background_glow">
    <circle cx="64" cy="64" r="44" fill="url(#ringAura)"/>
    <ellipse cx="64" cy="112" rx="26" ry="7" fill="#000000" opacity="0.35"/>
  </g>

  <!-- LAYER 2: Base Form (Heavy 24K Gold Ring Band & Bezel Setting) -->
  <g id="base_form">
    <!-- Solid Gold Signet Ring Outer Hoop -->
    <circle cx="64" cy="70" r="32" fill="url(#goldBand)"/>
    <!-- Hollow Finger Opening with Depth -->
    <circle cx="64" cy="70" r="20" fill="#0f172a"/>
    <!-- Inner Band Gold Rim Shadow -->
    <circle cx="64" cy="70" r="18" fill="#020617"/>
    <!-- Bezel Crown Gem Mount -->
    <rect x="50" y="28" width="28" height="14" rx="3" fill="url(#goldBand)"/>
  </g>

  <!-- LAYER 3: Details & Relief (Faceted Crimson Ruby Cushion Cut) -->
  <g id="details_and_relief">
    <!-- Ruby Diamond Base Facets -->
    <polygon points="52,32 76,32 72,16 64,12 56,16" fill="#be123c"/>
    <polygon points="56,32 72,32 68,18 60,18" fill="#e11d48"/>
    <polygon points="60,18 68,18 64,12" fill="#fda4af"/>
    <!-- Bezel Prong Claws -->
    <circle cx="52" cy="30" r="2.5" fill="#facc15"/>
    <circle cx="76" cy="30" r="2.5" fill="#facc15"/>
    <circle cx="55" cy="16" r="2" fill="#facc15"/>
    <circle cx="73" cy="16" r="2" fill="#facc15"/>
  </g>

  <!-- LAYER 4: Specular Highlights (Ruby Glint & Gold Glare Star) -->
  <g id="specular_highlights">
    <!-- Gem Table Highlight -->
    <polygon points="62,18 66,18 64,14" fill="#ffffff" opacity="0.95"/>
    <!-- Gold Ring Shoulder Glint -->
    <path d="M 40 58 Q 42 44 50 36" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <!-- Radiating Sparkle Star -->
    <line x1="64" y1="6" x2="64" y2="20" stroke="#ffffff" stroke-width="2"/>
    <line x1="57" y1="13" x2="71" y2="13" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
