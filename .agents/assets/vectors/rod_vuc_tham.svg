<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Abyssal Void Miasma & Eldritch Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(88, 28, 135, 0.22)" />
  <circle cx="82" cy="46" r="38" fill="rgba(192, 38, 211, 0.20)" />

  <!-- 2. Obsidian Nether-Titanium Shaft -->
  <line x1="24" y1="104" x2="84" y2="44" stroke="#090514" stroke-width="6.5" stroke-linecap="round" />
  <line x1="24" y1="104" x2="84" y2="44" stroke="#3b0764" stroke-width="4.5" stroke-linecap="round" />
  <line x1="24" y1="104" x2="84" y2="44" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" />
  <line x1="25" y1="103" x2="83" y2="45" stroke="#f5d0fe" stroke-width="0.9" stroke-linecap="round" />

  <!-- 3. Demonic Bone Horn Spire Bands along the shaft -->
  <!-- Band 1 -->
  <line x1="38" y1="93" x2="44" y2="87" stroke="#7e22ce" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="41,90 33,85 41,85" fill="#c026d3" />
  <polygon points="41,90 49,95 41,95" fill="#c026d3" />
  <circle cx="41" cy="90" r="1.5" fill="#fdf4ff" />

  <!-- Band 2 -->
  <line x1="53" y1="78" x2="59" y2="72" stroke="#7e22ce" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="56,75 48,70 56,70" fill="#c026d3" />
  <polygon points="56,75 64,80 56,80" fill="#c026d3" />
  <circle cx="56" cy="75" r="1.5" fill="#fdf4ff" />

  <!-- Band 3 -->
  <line x1="68" y1="63" x2="74" y2="57" stroke="#7e22ce" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="71,60 63,55 71,55" fill="#c026d3" />
  <polygon points="71,60 79,65 71,65" fill="#c026d3" />
  <circle cx="71" cy="60" r="1.5" fill="#fdf4ff" />

  <!-- 4. Nether Dragon Claw Pommel (Bottom-Left) -->
  <polygon points="20,102 26,108 22,114 14,106" fill="#3b0764" stroke="#c026d3" stroke-width="1.2" />
  <circle cx="21" cy="107" r="1.8" fill="#e879f9" />

  <!-- 5. Eldritch Void Crescent Scythe & All-Seeing Nether Eye Headpiece -->
  <!-- Crescent Void Blade -->
  <path d="M 84,44 Q 62,34 56,18 Q 78,26 84,44 Z" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <path d="M 84,44 Q 92,20 108,16 Q 100,34 84,44 Z" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <path d="M 84,44 Q 68,30 62,20" fill="none" stroke="#f0abfc" stroke-width="1.2" />

  <!-- Nether Eye Socket & Glowing Iris (All-Seeing Eye) -->
  <circle cx="84" cy="44" r="9" fill="#090514" stroke="#c026d3" stroke-width="1.5" />
  <circle cx="84" cy="44" r="6" fill="#7e22ce" />
  <circle cx="84" cy="44" r="3.5" fill="#e879f9" />
  <!-- Vertical Demon Slit Pupil -->
  <line x1="84" y1="40" x2="84" y2="48" stroke="#090514" stroke-width="1.8" stroke-linecap="round" />

  <!-- 6. Specular Glints -->
  <circle cx="56" cy="18" r="1.8" fill="#ffffff" />
  <circle cx="108" cy="16" r="1.8" fill="#ffffff" />
  <circle cx="82" cy="42" r="1.5" fill="#ffffff" />
  <circle cx="21" cy="107" r="1.4" fill="#ffffff" />
</svg>