<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Blood-Tide Maritime Curse Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(220, 38, 38, 0.18)" />
  <circle cx="64" cy="64" r="42" fill="rgba(153, 27, 27, 0.16)" />

  <!-- 2. Pirate Cutlass Brass Basket Eyelet Mount (Top-Left) -->
  <circle cx="38" cy="26" r="6" fill="#1c1917" stroke="#d97706" stroke-width="1.8" />
  <circle cx="38" cy="26" r="2.8" fill="#0f172a" />
  <!-- Brass Basket Guard Arc -->
  <path d="M 38,30 Q 18,44 32,58" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="23" cy="45" r="2.0" fill="#fef08a" />
  <!-- Dangling Spanish 8-Reales Silver Coin -->
  <line x1="32" y1="58" x2="24" y2="68" stroke="#d97706" stroke-width="1.2" />
  <circle cx="24" cy="72" r="5" fill="#cbd5e1" stroke="#475569" stroke-width="1.2" />
  <rect x="22.5" y="70.5" width="3" height="3" fill="#0f172a" />

  <!-- 3. Heavy Forged Damascus Steel Scythe Blade (Broad Solid Polygon) -->
  <!-- Dark Forged Spine Backing -->
  <path d="M 38,32 L 38,80 Q 46,104 68,108 Q 90,108 100,78 L 98,48 Q 86,70 72,84 Q 58,90 46,82 Z" fill="#1c1917" stroke="#451a03" stroke-width="1.5" />
  <!-- Damascus Slate Steel Blade Body -->
  <path d="M 40,34 L 40,78 Q 48,100 68,104 Q 88,104 97,76 L 96,50 Q 85,70 72,82 Q 58,88 47,80 Z" fill="#475569" />
  <!-- Razor Polished Mirror Blade Edge -->
  <path d="M 96,50 Q 85,70 72,82 Q 58,88 47,80" fill="none" stroke="#f8fafc" stroke-width="1.2" stroke-linecap="round" />

  <!-- 4. Reverse Wicked Barb on Inner Scythe Curve -->
  <polygon points="90,66 78,64 86,74" fill="#94a3b8" stroke="#ffffff" stroke-width="0.8" />

  <!-- 5. Etched Cursed Bloodline Fuller with Ruby Nodes -->
  <path d="M 39,40 L 39,78 Q 48,98 68,100 Q 82,100 92,78" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 39,40 L 39,78 Q 48,98 68,100 Q 82,100 92,78" fill="none" stroke="#fca5a5" stroke-width="0.9" stroke-linecap="round" />
  <!-- Glowing Blood Ruby Nodes -->
  <circle cx="39" cy="62" r="1.8" fill="#ef4444" />
  <circle cx="56" cy="94" r="1.8" fill="#ef4444" />
  <circle cx="82" cy="92" r="1.8" fill="#ef4444" />

  <!-- 6. Specular Glints -->
  <circle cx="98" cy="48" r="2.2" fill="#ffffff" />
  <circle cx="38" cy="24" r="1.5" fill="#ffffff" />
  <circle cx="68" cy="106" r="1.5" fill="#ffffff" />
  <circle cx="24" cy="70" r="1.2" fill="#ffffff" />
</svg>