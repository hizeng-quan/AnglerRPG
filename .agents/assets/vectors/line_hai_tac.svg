<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 1. Cursed Galleon Whirlpool & Spanish Gold Aura -->
  <circle cx="64" cy="64" r="54" fill="rgba(217, 119, 6, 0.18)" />
  <circle cx="64" cy="64" r="44" fill="rgba(30, 27, 75, 0.25)" />

  <!-- 2. Ornate Nautical Galleon Ship's Wheel (Mahogany & Brass) -->
  <circle cx="64" cy="64" r="48" fill="#3b1d11" stroke="#d97706" stroke-width="2.5" />
  <circle cx="64" cy="64" r="44" fill="none" stroke="#f59e0b" stroke-width="1.2" />
  <circle cx="64" cy="64" r="38" fill="#0f172a" />

  <!-- 8 Turned Wheel Handles extending beyond rim -->
  <line x1="64" y1="16" x2="64" y2="112" stroke="#d97706" stroke-width="2.2" />
  <line x1="16" y1="64" x2="112" y2="64" stroke="#d97706" stroke-width="2.2" />
  <line x1="30" y1="30" x2="98" y2="98" stroke="#d97706" stroke-width="2.2" />
  <line x1="30" y1="98" x2="98" y2="30" stroke="#d97706" stroke-width="2.2" />
  <!-- Spoke Knob Grips -->
  <circle cx="64" cy="12" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <circle cx="64" cy="116" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <circle cx="12" cy="64" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <circle cx="116" cy="64" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <circle cx="27" cy="27" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <circle cx="101" cy="101" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <circle cx="27" cy="101" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />
  <circle cx="101" cy="27" r="3.2" fill="#d97706" stroke="#fef08a" stroke-width="1" />

  <!-- 3. Heavy Forged Iron Admiralty Anchor in Center -->
  <line x1="64" y1="30" x2="64" y2="94" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />
  <!-- Anchor Stock (Crossbar) -->
  <line x1="44" y1="44" x2="84" y2="44" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="44" cy="44" r="2.2" fill="#d97706" />
  <circle cx="84" cy="44" r="2.2" fill="#d97706" />
  <!-- Anchor Curved Arms & Flukes -->
  <path d="M 44,76 Q 64,102 84,76" fill="none" stroke="#334155" stroke-width="4.2" stroke-linecap="round" />
  <!-- Fluke Spades -->
  <polygon points="44,76 38,68 48,70" fill="#64748b" stroke="#94a3b8" stroke-width="0.8" />
  <polygon points="84,76 90,68 80,70" fill="#64748b" stroke="#94a3b8" stroke-width="0.8" />

  <!-- 4. Coiled Heavy Wrought-Iron Chain Links wrapping around wheel -->
  <circle cx="64" cy="34" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.8" />
  <circle cx="86" cy="42" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.8" />
  <circle cx="94" cy="64" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.8" />
  <circle cx="86" cy="86" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.8" />
  <circle cx="42" cy="42" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.8" />
  <circle cx="34" cy="64" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.8" />
  <circle cx="42" cy="86" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.8" />

  <!-- 5. Golden Pirate Doubloon Wheel Hub Medallion -->
  <circle cx="64" cy="64" r="15" fill="#d97706" stroke="#fef08a" stroke-width="1.5" />
  <circle cx="64" cy="64" r="12" fill="#b45309" />
  <!-- Center Ivory Skull Boss -->
  <circle cx="64" cy="63" r="5.5" fill="#f1f5f9" />
  <rect x="62" y="66" width="4" height="2.5" fill="#f1f5f9" />
  <!-- Glowing Emerald Eye Sockets -->
  <circle cx="62" cy="63" r="1.1" fill="#10b981" />
  <circle cx="66" cy="63" r="1.1" fill="#10b981" />

  <!-- 6. Specular Glints -->
  <circle cx="64" cy="30" r="1.8" fill="#ffffff" />
  <circle cx="44" cy="76" r="1.5" fill="#ffffff" />
  <circle cx="84" cy="76" r="1.5" fill="#ffffff" />
  <circle cx="64" cy="61" r="1.5" fill="#ffffff" />
</svg>